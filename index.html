    <script>
    // واجهة الافتتاحية: تظهر مرة واحدة فقط عند فتح الموقع (لكل جلسة).
    // التحديث أو الرجوع أو التنقل لا يُظهرها، ويُحسم هذا قبل أول رسم للصفحة حتى لا يحدث وميض.
    (function () {
        var seen = false;
        try { seen = !!sessionStorage.getItem('splash_shown'); } catch (e) {}
        try {
            var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
            if (nav && (nav.type === 'reload' || nav.type === 'back_forward')) seen = true;
        } catch (e) {}
        window.__showSplash = !seen;
        if (seen) document.documentElement.classList.add('splash-seen');
        else { try { sessionStorage.setItem('splash_shown', 'true'); } catch (e) {} }
    })();
    </script>

    <script>
(function(window) {
    class Playerjs {
        constructor(config) {
            if (!config || !config.id || !config.file) return;
            this.container = document.getElementById(config.id);
            this.events = {};
            this.hls = null;
            this.video = document.createElement('video');
            this.video.controls = true;
            this.video.playsInline = true;
            this.video.autoplay = !!config.autoplay;
            this.video.crossOrigin = 'anonymous';
            this.video.style.width = '100%';
            this.video.style.height = '100%';
            this.video.style.borderRadius = '12px';
            this.video.style.backgroundColor = '#000';
            if (this.container) {
                this.container.innerHTML = '';
                this.container.appendChild(this.video);
            }
            this.url = config.file;
            if (this.url && this.url.includes('.m3u8') && window.Hls && Hls.isSupported()) {
                this.hls = new Hls();
                this.hls.loadSource(this.url);
                this.hls.attachMedia(this.video);
                this.hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        this.emit('error', data);
                    }
                });
            } else if (this.url) {
                this.video.src = this.url;
            }
            this.video.addEventListener('error', () => {
                this.emit('error', { message: 'Video element error', code: this.video.error ? this.video.error.code : null });
            });
            if (this.video.autoplay) {
                this.video.play().catch(() => {});
            }
        }

        on(event, callback) {
            if (!this.events[event]) this.events[event] = [];
            this.events[event].push(callback);
        }

        emit(event, data) {
            if (!this.events[event]) return;
            this.events[event].forEach((callback) => {
                try {
                    callback(data);
                } catch (err) {
                    console.error('Playerjs event callback error:', err);
                }
            });
        }

        pause() {
            if (this.video && typeof this.video.pause === 'function') {
                this.video.pause();
            }
        }

        destroy() {
            if (this.hls && typeof this.hls.destroy === 'function') {
                this.hls.destroy();
                this.hls = null;
            }
            if (this.video) {
                try {
                    this.video.pause();
                } catch (err) {}
                if (this.video.parentNode) {
                    this.video.parentNode.removeChild(this.video);
                }
                this.video = null;
            }
            if (this.container) {
                this.container.innerHTML = '';
                this.container = null;
            }
            this.events = {};
        }
    }

    window.Playerjs = Playerjs;

const FALLBACK_ORDER = ['videojs', 'hlsjs', 'playerjs', 'jwplayer', 'dplayer', 'shaka', 'dashjs', 'flowplayer', 'clappr', 'plyr', 'mediaelement', 'openplayer', 'mediachrome', 'flvjs', 'native'];

function cleanupAllPlayers() {
    currentPlayerEngine = null;
    
    // 1. إيقاف وتنظيف جميع عناصر الفيديو (Video.js, HLS, HTML5)
    const videoElements = document.querySelectorAll('video');
    videoElements.forEach(video => {
        try {
            video.pause();
            video.removeAttribute('src');
            video.load();
            video.muted = true;
        } catch (e) {}
    });

    // 2. إيقاف وتنظيف جميع الـ iframe (YouTube وغيره) لضمان انقطاع الصوت
    const allIframes = document.querySelectorAll('iframe');
    allIframes.forEach(iframe => {
        try {
            if (iframe.id !== 'externalLinkIframe' && iframe.getAttribute('src')) {
                swapIframe(iframe, '');
            }
        } catch (e) {}
    });

    // 3. تدمير كائنات المشغلات البرمجية
    if (videojsInstance) { try { videojsInstance.dispose(); } catch(e){} videojsInstance = null; }
    if (hlsjsInstance) { try { hlsjsInstance.destroy(); } catch(e){} hlsjsInstance = null; }
    if (shakaPlayerInstance) { try { shakaPlayerInstance.destroy(); } catch(e){} shakaPlayerInstance = null; }
    if (dashjsInstance) { try { dashjsInstance.reset(); } catch(e){} dashjsInstance = null; }
    if (clapprInstance) { try { clapprInstance.destroy(); } catch(e){} clapprInstance = null; }
    if (plyrInstance) { try { plyrInstance.destroy(); } catch(e){} plyrInstance = null; }
    if (dplayerInstance) { try { dplayerInstance.destroy(); } catch(e){} dplayerInstance = null; }
    if (mediaelementInstance) { try { mediaelementInstance.remove(); } catch(e){} mediaelementInstance = null; }
    if (openplayerInstance) { try { openplayerInstance.destroy(); } catch(e){} openplayerInstance = null; }
    if (flvjsInstance) { try { flvjsInstance.destroy(); } catch(e){} flvjsInstance = null; }
    if (jwplayerInstance) { try { jwplayerInstance.remove(); } catch(e){} jwplayerInstance = null; }
    if (flowplayerInstance) { try { flowplayerInstance.shutdown(); } catch(e){} flowplayerInstance = null; }
    
    cleanupPlayerJS();
    cleanupNativePlayer();
    
    // إخفاء جميع حاويات المشغلات
    ['video-player', 'native-video', 'playerjs-container', 'clappr-container', 'dplayer-container', 'openplayer-container', 'mediachrome-container', 'shaka-video', 'dashjs-video', 'plyr-video', 'mediaelement-video', 'jwplayer-container', 'flowplayer-container', 'youtube-container'].forEach(id => {
        const el = $(id);
        if (el) el.classList.add('hidden');
    });
    
    // إعادة التمرير للأعلى عند إغلاق المشغل فقط إذا كنا ننتقل لصفحة جديدة
    if (document.body.classList.contains('player-open')) {
        window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
    }
}

function fallbackToNextEngine(url) {
    if (parallelEngineSuccessful) return;
    
    for (let engine of FALLBACK_ORDER) {
        if (!attemptedFallbacks[engine]) {
            setPlayerSource(url, engine, false);
            return true;
        }
    }
    
    const engineSelect = $('playerEngineSelect');
    if (engineSelect) engineSelect.value = 'auto';
    return fallbackToNextLink();
}

function fallbackToNextLink() {
    if (!currentChannelLinks || currentChannelLinks.length <= 1) return false;
    const nextIndex = currentLinkIndex + 1;
    if (nextIndex >= currentChannelLinks.length) {
        showPlayerError('عذراً، جميع الروابط غير مدعومة');
        return false;
    }
    
    currentLinkIndex = nextIndex;
    currentQualityIndex = nextIndex;
    currentQualityMode = 'links';
    
    Object.keys(attemptedFallbacks).forEach(k => attemptedFallbacks[k] = false);
    parallelEngineSuccessful = false;
    
    setupQualityButtons(currentChannelLinks, 'links');
    document.querySelectorAll('.quality-button').forEach((btn, i) => {
        btn.classList.toggle('active', i === nextIndex);
    });
    
    toast(`جاري الانتقال للرابط التالي...`);
    
    setTimeout(() => {
        tryEnginesInParallel(currentChannelLinks[nextIndex].url, 5);
    }, 300);
    
    return true;
}

let engineTimeoutHandle = null;
function tryEnginesInParallel(url, numEngines = 5) {
    if (!url) return;
    
    if (engineTimeoutHandle) clearTimeout(engineTimeoutHandle);
    parallelEngineAttempts = 0;
    parallelEngineSuccessful = false;
    Object.keys(attemptedFallbacks).forEach(k => attemptedFallbacks[k] = false);
    
    const enginesToTry = FALLBACK_ORDER.slice(0, numEngines);
    const startTimestamp = Date.now();
    
    enginesToTry.forEach((engine, idx) => {
        setTimeout(() => {
            if (!parallelEngineSuccessful) {
                parallelEngineAttempts++;
                setPlayerSource(url, engine, false);
            }
        }, idx * 200);
    });
    
    engineTimeoutHandle = setTimeout(() => {
        if (!parallelEngineSuccessful && parallelEngineAttempts >= numEngines) {
            fallbackToNextLink();
        }
    }, 5000);
}
window.currentViewMode = 'home';
window.currentExternalUrl = '';

function toast(message, duration = 2600) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toastEl = document.createElement('div');
    toastEl.className = 'toast';
    toastEl.textContent = message;
    document.body.appendChild(toastEl);
    setTimeout(() => {
        if (toastEl && toastEl.parentNode) toastEl.parentNode.removeChild(toastEl);
    }, duration);
}

function getYouTubeID(url) {
    if (!url || typeof url !== 'string') return null;
    try {
        const urlObj = new URL(url);
        // youtu.be/ID
        if (urlObj.hostname === 'youtu.be') {
            return urlObj.pathname.slice(1).split(/[?#]/)[0];
        }
        // youtube.com/...
        if (urlObj.hostname.includes('youtube.com')) {
            // live, embed, v, shorts
            const paths = ['/live/', '/embed/', '/v/', '/shorts/'];
            for (const p of paths) {
                if (urlObj.pathname.includes(p)) {
                    return urlObj.pathname.split(p)[1].split(/[?#]/)[0];
                }
            }
            // watch?v=ID
            if (urlObj.searchParams.has('v')) {
                return urlObj.searchParams.get('v');
            }
        }
    } catch (e) {
        // Fallback for malformed URLs or simple strings
    }
    // Regex fallback for any 11-char ID after v= or /
    const m = url.match(/(?:v=|\/|vi\/|live\/|shorts\/|embed\/)([0-9A-Za-z_-]{11})/);
    return m ? m[1] : null;
}

// تغيير src على iframe موجود يضيف عنصراً في سجل المتصفح (يظهر كأن زر الرجوع لا يعمل ويُلغي زر التقدّم).
// لذلك نستبدل العنصر بنسخة جديدة يُحدَّد رابطها قبل إدراجها، وهذا لا يضيف شيئاً للسجل.
function swapIframe(iframe, url) {
    if (!iframe || !iframe.parentNode) return iframe;
    const fresh = iframe.cloneNode(false);
    if (url) fresh.setAttribute('src', url); else fresh.removeAttribute('src');
    iframe.parentNode.replaceChild(fresh, iframe);
    return fresh;
}

// يعيد كائن قناة لمعرّف موجود في الرابط (#...|id)، بما فيها فيديوهات يوتيوب وروابط الأقسام التي لا تُخزَّن كقنوات
function findChannelById(id) {
    if (!id) return null;
    const found = (channelsCache || []).find(ch => ch.id === id);
    if (found) return found;
    const sid = String(id);
    if (sid.indexOf('yt_') === 0) {
        const vid = sid.slice(3);
        if (/^[\w-]{11}$/.test(vid)) {
            return { id: sid, name: 'يوتيوب', img: '', links: { main: { label: 'يوتيوب', url: 'https://www.youtube.com/watch?v=' + vid } } };
        }
    }
    if (sid.indexOf('cat_') === 0) {
        const cat = categoriesCache[sid.slice(4)];
        const url = cat ? String(cat.link || cat.url || cat.externalLink || '').trim() : '';
        if (url && getYouTubeID(url)) return { id: sid, name: cat.name || 'رابط يوتيوب', img: cat.img, links: { main: { label: 'بث يوتيوب', url } } };
    }
    return null;
}

window.addEventListener('popstate', (event) => {
    // عارض الشورتس: الرجوع يغلقه فقط بدون تغيير الصفحة تحته
    if (window.ytShortsSkipPop) { window.ytShortsSkipPop = false; return; }
    if (window.ytShortsOpen) { ytCloseShortsViewer(false); return; }
    // إيقاف المشغلات فوراً لضمان توقف الصوت
    cleanupAllPlayers();

    // استعادة الحالة: نفضل event.state إذا كان موجوداً وصحيحاً
    let state = event.state;
    if (!state || state.path !== 'navigation') {
        state = restoreHashState();
    }
    
    // تحديث المتغيرات العالمية من الحالة المستعادة
    currentStack = Array.isArray(state.stack) ? [...state.stack] : [];
    currentChannelId = state.channelId || null;
    window.currentViewMode = state.viewMode || 'home';
    window.currentExternalUrl = state.externalUrl || '';
    window.ytNav = (window.currentViewMode === 'home') ? ytParseHash(window.location.hash.slice(1).split('@')[1] || '') : null;

    // إخفاء حاوية المشغل يدوياً
    const pc = $('playerContainer');
    if (!currentChannelId) {
        if (pc) pc.classList.add('hidden');
        document.body.classList.remove('player-open');
        document.body.style.overflow = '';
    }

    // تحديث الواجهة فوراً دون إعادة تحميل الصفحة
    applyViewMode();
    renderCurrentView();
    
    // تشغيل القناة إذا كانت الحالة تتضمن قناة
    if (currentChannelId) {
        const channel = findChannelById(currentChannelId);
        if (channel) {
            selectChannel(channel, false);
        } else {
            if (pc) pc.classList.add('hidden');
            document.body.classList.remove('player-open');
            currentChannelId = null;
        }
    }
});

function applyViewMode() {
    const homeNav = $('homeNav');
    const matchesNav = $('matchesNav');
    const grid = $('grid');
    const matchesGrid = $('matchesGrid');
    const matchesTableContainer = $('matchesTableContainer');
    const externalLinkContainer = $('externalLinkContainer');
    const playerContainer = $('playerContainer');
    
    if (currentChannelId && playerContainer) {
        playerContainer.classList.remove('hidden');
        document.body.classList.add('player-open');
    } else if (playerContainer) {
        playerContainer.classList.add('hidden');
        document.body.classList.remove('player-open');
    }

    if (window.currentViewMode !== 'externalLink') {
        const extFrame = $('externalLinkIframe');
        if (extFrame && extFrame.getAttribute('src')) swapIframe(extFrame, '');
    }

    if (window.currentViewMode === 'matches') {
        if (grid) grid.classList.add('hidden');
        if (matchesGrid) matchesGrid.classList.remove('hidden');
        if (matchesTableContainer) matchesTableContainer.classList.add('hidden');
        if (externalLinkContainer) externalLinkContainer.classList.add('hidden');
        if (matchesNav) matchesNav.classList.add('active');
        if (homeNav) homeNav.classList.remove('active');
    } else if (window.currentViewMode === 'matchesTable') {
        if (grid) grid.classList.add('hidden');
        if (matchesGrid) matchesGrid.classList.add('hidden');
        if (matchesTableContainer) matchesTableContainer.classList.remove('hidden');
        if (externalLinkContainer) externalLinkContainer.classList.add('hidden');
        if (matchesNav) matchesNav.classList.add('active');
        if (homeNav) homeNav.classList.remove('active');
    } else if (window.currentViewMode === 'externalLink') {
        if (grid) grid.classList.add('hidden');
        if (matchesGrid) matchesGrid.classList.add('hidden');
        if (matchesTableContainer) matchesTableContainer.classList.add('hidden');
        if (externalLinkContainer) {
            externalLinkContainer.classList.remove('hidden');
            const iframe = $('externalLinkIframe');
            if (iframe && iframe.getAttribute('src') !== window.currentExternalUrl) swapIframe(iframe, window.currentExternalUrl);
        }
        if (homeNav) homeNav.classList.add('active');
        if (matchesNav) matchesNav.classList.remove('active');
    } else {
        if (grid) grid.classList.remove('hidden');
        if (matchesGrid) matchesGrid.classList.add('hidden');
        if (matchesTableContainer) matchesTableContainer.classList.add('hidden');
        if (externalLinkContainer) externalLinkContainer.classList.add('hidden');
        if (homeNav) homeNav.classList.add('active');
        if (matchesNav) matchesNav.classList.remove('active');
    }
}

function serializeStack(stack) {
    return stack.filter(Boolean).join(',');
}

function buildHash(stack, channelId) {
    if (window.currentViewMode === 'matches') return 'matches';
    if (window.currentViewMode === 'matchesTable') return 'matchesTable';
    if (window.currentViewMode === 'externalLink' && window.currentExternalUrl) return `ext:${encodeURIComponent(window.currentExternalUrl)}`;
    const stackHash = serializeStack(stack);
    const yt = (window.ytNav && window.ytNav.ch) ? '@' + window.ytNav.ch + (window.ytNav.pl ? '.' + window.ytNav.pl + (window.ytNav.solo ? '.s' : '') : '') : '';
    if (!stackHash && !channelId && !yt) return null;
    const base = channelId ? `${stackHash}|${channelId}` : stackHash;
    return base + yt;
}

function pushState() {
    const hash = buildHash(currentStack, currentChannelId);
    const url = hash ? `#${hash}` : '#';
    
    const stateData = { 
        path: 'navigation', 
        stack: [...currentStack], 
        channelId: currentChannelId, 
        viewMode: window.currentViewMode, 
        externalUrl: window.currentExternalUrl 
    };

    // التحقق من أن الـ URL مختلفة فعلاً قبل إضافة حالة جديدة
    if (window.location.hash !== url) {
        window.history.pushState(stateData, '', url);
    } else {
        window.history.replaceState(stateData, '', url);
    }
}

function restoreHashState() {
    const hash = window.location.hash.slice(1);
    if (!hash || hash === '') return { stack: [], channelId: null, viewMode: 'home', externalUrl: '' };
    
    if (hash === 'matches') return { stack: [], channelId: null, viewMode: 'matches', externalUrl: '' };
    if (hash === 'matchesTable') return { stack: [], channelId: null, viewMode: 'matchesTable', externalUrl: '' };
    if (hash.startsWith('ext:')) {
        const url = decodeURIComponent(hash.slice(4));
        return { stack: [], channelId: null, viewMode: 'externalLink', externalUrl: url };
    }
    
    let mainPart = hash, ytPart = '';
    const atPos = hash.indexOf('@');
    if (atPos !== -1) { mainPart = hash.slice(0, atPos); ytPart = hash.slice(atPos + 1); }
    const [stackPart, channelId] = mainPart.split('|');
    const ids = stackPart ? stackPart.split(',').filter(Boolean) : [];
    
    const validStack = ids.filter(id => categoriesCache[id]);
    
    return { stack: validStack, channelId: channelId || null, viewMode: 'home', externalUrl: '', yt: ytParseHash(ytPart) };
}

function openCategoryLink(category) {
    const url = String(category.link || category.url || category.externalLink || '').trim();
    if (!url) return false;
    const ytId = getYouTubeID(url);
    if (ytId) {
        selectChannel({
            id: 'cat_' + String(category.id),
            name: category.name || 'رابط يوتيوب',
            img: category.img,
            links: { main: { label: 'بث يوتيوب', url } }
        });
        return true;
    }
    window.currentViewMode = 'externalLink';
    window.currentExternalUrl = url;
    applyViewMode();
    pushState();
    return true;
}

function getDescendants(rootId) {
    const ids = [rootId];
    for (let i = 0; i < ids.length; i++) {
        Object.values(categoriesCache).forEach(c => {
            if (c.parentId === ids[i] && !ids.includes(c.id)) ids.push(c.id);
        });
    }
    return ids;
}

function getChannelCategoryIds(channel) {
    if (!channel) return [];
    let ids = [];
    if (channel.categoryIds) {
        ids = Array.isArray(channel.categoryIds) ? channel.categoryIds : Object.values(channel.categoryIds);
    } else if (channel.categories) {
        ids = Array.isArray(channel.categories) ? channel.categories : Object.values(channel.categories);
    } else if (channel.categoryId) {
        ids = [channel.categoryId];
    } else if (channel.catId) {
        ids = [channel.catId];
    }
    return ids.map(id => String(id)).filter(id => id && id !== 'undefined');
}

function getYouTubeThumbnail(url) {
    const ytId = getYouTubeID(url);
    return ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : '';
}

function getChannelCardImage(channel) {
    if (!channel) return DEFAULT_IMAGE;
    if (channel.img) return channel.img;
    if (ytChannelLinkOf(channel)) return DEFAULT_IMAGE;
    const links = parseChannelLinks(channel);
    const ytLink = links.find(link => link.url && getYouTubeID(link.url));
    if (ytLink) return getYouTubeThumbnail(ytLink.url);
    return DEFAULT_IMAGE;
}

function parseChannelLinks(ch) {
    const links = [];
    if (ch.links && typeof ch.links === 'object') {
        Object.keys(ch.links).forEach(key => {
            const entry = ch.links[key];
            if (entry && entry.url) {
                links.push({ label: entry.label || key, url: entry.url });
            } else if (typeof entry === 'string') {
                links.push({ label: key, url: entry });
            }
        });
    }
    ['mainLink', 'hdLink', 'sdLink', 'backupLink', 'url', 'stream', 'src', 'play', 'link', 'video', 'm3u8', 'mp4'].forEach(prop => {
        if (ch[prop] && typeof ch[prop] === 'string' && !links.some(l => l.url === ch[prop])) {
            links.push({ label: prop, url: ch[prop] });
        }
    });
    if (ch.url && typeof ch.url === 'string' && !links.some(l => l.url === ch.url)) {
        links.push({ label: 'الرئيسي', url: ch.url });
    }
    const priority = ['الرئيسي', 'main', 'auto', 'Auto', 'AUTO'];
    links.sort((a, b) => {
        const aIndex = priority.findIndex(label => a.label.includes(label));
        const bIndex = priority.findIndex(label => b.label.includes(label));
        if (aIndex === -1 && bIndex === -1) return 0;
        if (aIndex === -1) return 1;
        if (bIndex === -1) return -1;
        return aIndex - bIndex;
    });
    return links;
}

function updateQualityMenu() {
    const list = $('qualityOptionList');
    if (!list) return;
    list.classList.add('hidden');
    if ((currentQualityMode !== 'hls' && currentQualityMode !== 'links') || !currentQualitySources || currentQualitySources.length <= 1) {
        list.innerHTML = '';
        return;
    }
    list.innerHTML = '';
    currentQualitySources.forEach((source, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'quality-option-item' + (idx === currentQualityIndex ? ' active' : '');
        btn.textContent = source.label || `الجودة ${idx + 1}`;
        btn.onclick = (e) => {
            e.stopPropagation();
            currentQualityIndex = idx;
            if (currentQualityMode === 'links') {
                currentLinkIndex = idx;
                setPlayerSource(source.url);
            } else if (currentQualityMode === 'hls') {
                currentQualitySources.forEach((item, i) => {
                    if (item.rep && typeof item.rep.enabled === 'function') {
                        item.rep.enabled(i === idx);
                    }
                });
            }
            document.querySelectorAll('.quality-option-item').forEach((item, i) => item.classList.toggle('active', i === idx));
            closeQualityMenu();
        };
        list.appendChild(btn);
    });
}

function toggleQualityMenu(event) {
    if (event) event.stopPropagation();
    const list = $('qualityOptionList');
    if (list) list.classList.toggle('hidden');
}

function closeQualityMenu() {
    const list = $('qualityOptionList');
    if (list) list.classList.add('hidden');
}

document.addEventListener('click', closeQualityMenu);

function getHlsRepresentations(player) {
    const tech = player.tech({ IWillNotUseThisInPlugins: true });
    if (!tech || !tech.vhs) return [];
    if (typeof tech.vhs.representations === 'function') {
        return tech.vhs.representations().map(rep => ({
            label: rep.height ? `${rep.height}p` : rep.bandwidth ? `${Math.round(rep.bandwidth/1000)}kbps` : 'Unknown',
            rep
        }));
    }
    const master = tech.vhs.playlists && tech.vhs.playlists.master;
    if (!master || !Array.isArray(master.playlists)) return [];
    return master.playlists.map((playlist, index) => ({
        label: playlist.attributes.RESOLUTION ? `${playlist.attributes.RESOLUTION.height}p` : `جودة ${index + 1}`,
        playlist
    }));
}

function detectHlsQualities(player) {
    const reps = getHlsRepresentations(player);
    if (reps.length <= 1) return;
    currentQualityMode = 'hls';
    currentQualitySources = reps;
    currentQualityIndex = 0;
    updateQualityMenu();
    showQualityButtons();
}

function setupQualityButtons(links, mode = 'links') {
    const container = $('qualityButtons');
    if (container) container.innerHTML = '';
    currentQualityMode = mode;
    currentQualitySources = links;
    if (mode === 'links' && links.length > 1) {
        links.forEach((link, idx) => {
            const btn = document.createElement('button');
            btn.className = 'quality-button' + (idx === 0 ? ' active' : '');
            btn.textContent = link.label;
            btn.onclick = (e) => {
                e.stopPropagation();
                currentQualityIndex = idx;
                currentLinkIndex = idx;
                document.querySelectorAll('.quality-button').forEach((b, i) => b.classList.toggle('active', i === idx));
                setPlayerSource(link.url);
                updateQualityMenu();
            };
            if (container) container.appendChild(btn);
        });
    }
    updateQualityMenu();
    showQualityButtons();
}

function cleanupPlayerJS() {
    const playerjsEl = $('playerjs-container');
    if (playerjsEngineInstance && typeof playerjsEngineInstance.destroy === 'function') playerjsEngineInstance.destroy();
    playerjsEngineInstance = null;
    if (playerjsEl) {
        playerjsEl.innerHTML = '';
        playerjsEl.classList.add('hidden');
    }
}

function initializePlayerJS(url) {
    const playerjsEl = $('playerjs-container');
    if (!playerjsEl) {
        setPlayerSource(url, 'native', false);
        return;
    }
    if (typeof window.Playerjs === 'undefined') {
        if (!attemptedFallbacks.native) {
            attemptedFallbacks.native = true;
            setPlayerSource(url, 'native', false);
            return;
        }
        if (!attemptedFallbacks.videojs) {
            attemptedFallbacks.videojs = true;
            setPlayerSource(url, 'videojs', false);
            return;
        }
        fallbackToNextLink();
        return;
    }
    cleanupPlayerJS();
    showActivePlayer('playerjs');
    playerjsEngineInstance = new Playerjs({ id: 'playerjs-container', file: url, autoplay: true });
    if (playerjsEngineInstance && typeof playerjsEngineInstance.on === 'function') {
        playerjsEngineInstance.on('error', () => {
            if (!attemptedFallbacks.native) {
                attemptedFallbacks.native = true;
                setPlayerSource(url, 'native', false);
                return;
            }
            if (!attemptedFallbacks.videojs) {
                attemptedFallbacks.videojs = true;
                setPlayerSource(url, 'videojs', false);
                return;
            }
            fallbackToNextLink();
        });
    }
}

function showActivePlayer(engine) {
    cleanupAllPlayers();
    let id = '';
    switch(engine) {
        case 'videojs': case 'hlsjs': case 'flvjs': id = 'video-player'; break;
        case 'shaka': id = 'shaka-video'; break;
        case 'dashjs': id = 'dashjs-video'; break;
        case 'clappr': id = 'clappr-container'; break;
        case 'plyr': id = 'plyr-video'; break;
        case 'dplayer': id = 'dplayer-container'; break;
        case 'mediaelement': id = 'mediaelement-video'; break;
        case 'openplayer': id = 'openplayer-container'; break;
        case 'mediachrome': id = 'mediachrome-container'; break;
        case 'playerjs': id = 'playerjs-container'; break;
        case 'youtube': id = 'youtube-container'; break;
        case 'native': id = 'native-video'; break;
    }
    if (id && $(id)) $(id).classList.remove('hidden');
}

function initializeNativePlayer(url) {
    const nativeEl = $('native-video');
    if (!nativeEl) return;
    cleanupNativePlayer();
    showActivePlayer('native');
    nativeEl.controls = true;
    nativeEl.autoplay = true;
    nativeEl.playsInline = true;
    nativeEl.removeAttribute('src');
    nativeEl.load();
    if (url.includes('m3u8') && window.Hls && Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(nativeEl);
        nativePlayerInstance = hls;
    } else {
        nativeEl.src = url;
        nativePlayerInstance = nativeEl;
    }
    nativeEl.onloadedmetadata = () => nativeEl.play().catch(() => {});
    if (url.includes('m3u8') && window.Hls && Hls.isSupported()) {
        const hls = nativePlayerInstance;
        hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
                hls.destroy();
                fallbackToNextEngine(url);
            }
        });
    }
    nativeEl.onerror = () => {
        fallbackToNextEngine(url);
    };
}

function setPlayerSource(url, engine = 'videojs', resetFallbacks = true) {
    if (!url) return;
    
    if (!resetFallbacks && parallelEngineSuccessful) return;
    
    currentPlayerEngine = engine;
    if (resetFallbacks) {
        Object.keys(attemptedFallbacks).forEach(k => attemptedFallbacks[k] = false);
        parallelEngineSuccessful = false;
    }
    attemptedFallbacks[engine] = true;
    showActivePlayer(engine);

    const engineSelect = $('playerEngineSelect');
    if (engineSelect) {
        if (resetFallbacks) {
            engineSelect.value = 'auto';
        } else {
            engineSelect.value = engine;
        }
    }

    try {
        switch(engine) {
            case 'videojs':
                videojsInstance = videojs('video-player', { autoplay: true, controls: true, responsive: true, fluid: false, preload: 'auto', muted: false });
                videojsInstance.src({ src: url, type: url.includes('m3u8') ? 'application/x-mpegURL' : 'video/mp4' });
                videojsInstance.ready(function() {
                    if (!resetFallbacks) parallelEngineSuccessful = true;
                    this.play().catch(e => console.error("Autoplay failed:", e));
                });
                videojsInstance.on('error', () => fallbackToNextEngine(url));
                break;
            case 'hlsjs':
                if (Hls.isSupported()) {
                    hlsjsInstance = new Hls();
                    hlsjsInstance.loadSource(url);
                    const v = $('video-player');
                    hlsjsInstance.attachMedia(v);
                    hlsjsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        v.play().catch(e => console.error("HLS Autoplay failed:", e));
                    });
                    hlsjsInstance.on(Hls.Events.ERROR, (e, data) => { if (data.fatal) fallbackToNextEngine(url); });
                } else fallbackToNextEngine(url);
                break;
            case 'shaka':
                const sv = $('shaka-video');
                shakaPlayerInstance = new shaka.Player(sv);
                shakaPlayerInstance.load(url).then(() => {
                    sv.play().catch(e => console.error("Shaka Autoplay failed:", e));
                }).catch(() => fallbackToNextEngine(url));
                shakaPlayerInstance.addEventListener('error', () => fallbackToNextEngine(url));
                break;
            case 'dashjs':
                const dv = $('dashjs-video');
                dashjsInstance = dashjs.MediaPlayer().create();
                dashjsInstance.initialize(dv, url, true);
                dv.play().catch(e => console.error("DASH Autoplay failed:", e));
                dashjsInstance.on('error', () => fallbackToNextEngine(url));
                break;
            case 'clappr':
                clapprInstance = new Clappr.Player({ source: url, parentId: '#clappr-container', autoPlay: true, mute: false });
                clapprInstance.on(Clappr.Events.PLAYER_READY, () => {
                    const cv = document.querySelector('#clappr-container video');
                    if (cv) cv.play().catch(e => console.error("Clappr Autoplay failed:", e));
                });
                clapprInstance.on(Clappr.Events.PLAYER_ERROR, () => fallbackToNextEngine(url));
                break;
            case 'plyr':
                const pv = $('plyr-video');
                plyrInstance = new Plyr(pv, { autoplay: true });
                pv.src = url;
                pv.play().catch(e => console.error("Plyr Autoplay failed:", e));
                pv.onerror = () => fallbackToNextEngine(url);
                break;
            case 'dplayer':
                dplayerInstance = new DPlayer({ container: $('dplayer-container'), video: { url: url, type: url.includes('m3u8') ? 'hls' : 'auto' }, autoplay: true });
                dplayerInstance.play();
                dplayerInstance.on('error', () => fallbackToNextEngine(url));
                break;
            case 'mediaelement':
                mediaelementInstance = new MediaElementPlayer('mediaelement-video', { 
                    success: (me) => { 
                        me.setSrc(url); 
                        me.play().catch(e => console.error("MediaElement Autoplay failed:", e));
                        me.addEventListener('error', () => fallbackToNextEngine(url));
                    },
                    error: () => fallbackToNextEngine(url)
                });
                break;
            case 'openplayer':
                openplayerInstance = new OpenPlayerJS('openplayer-container');
                openplayerInstance.init();
                openplayerInstance.src = { src: url, type: 'application/x-mpegURL' };
                const ov = document.querySelector('#openplayer-container video');
                if (ov) {
                    ov.play().catch(e => console.error("OpenPlayer Autoplay failed:", e));
                    ov.onerror = () => fallbackToNextEngine(url);
                }
                break;
            case 'mediachrome':
                const mv = $('mediachrome-video');
                mv.src = url;
                mv.play().catch(e => console.error("MediaChrome Autoplay failed:", e));
                mv.onerror = () => fallbackToNextEngine(url);
                break;
            case 'flvjs':
                if (flvjs.isSupported()) {
                    const fv = $('video-player');
                    flvjsInstance = flvjs.createPlayer({ type: 'flv', url: url });
                    flvjsInstance.attachMediaElement(fv);
                    flvjsInstance.load();
                    flvjsInstance.play().catch(e => console.error("FLV Autoplay failed:", e));
                    flvjsInstance.on(flvjs.Events.ERROR, () => fallbackToNextEngine(url));
                } else fallbackToNextEngine(url);
                break;
            case 'jwplayer':
                if (typeof jwplayer !== 'undefined') {
                    jwplayerInstance = jwplayer('jwplayer-container').setup({
                        file: url,
                        autostart: true,
                        mute: false,
                        width: '100%',
                        height: '100%'
                    });
                    jwplayerInstance.on('error', () => fallbackToNextEngine(url));
                    jwplayerInstance.on('setupError', () => fallbackToNextEngine(url));
                } else fallbackToNextEngine(url);
                break;
            case 'flowplayer':
                if (typeof flowplayer !== 'undefined') {
                    flowplayerInstance = flowplayer('#flowplayer-container', {
                        clip: { sources: [{ type: 'application/x-mpegurl', src: url }] },
                        autoplay: true
                    });
                    flowplayerInstance.on('error', () => fallbackToNextEngine(url));
                } else fallbackToNextEngine(url);
                break;
            case 'youtube':
                try {
                    showActivePlayer('youtube');
                    const iframe = $('youtube-iframe');
                    if (iframe) {
                        const id = getYouTubeID(url);
                        if (id) {
                            // استخدام الرابط الصحيح للتضمين مع إضافة المعلمات اللازمة لتجاوز الرفض
                            swapIframe(iframe, `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&playsinline=1&enablejsapi=1&origin=${window.location.origin}`);
                        } else {
                            swapIframe(iframe, url);
                        }
                    }
                } catch(e) { fallbackToNextEngine(url); }
                break;
            case 'playerjs':
                initializePlayerJS(url);
                break;
            case 'native':
                initializeNativePlayer(url);
                break;
        }
    } catch(e) {
        console.error(`Error in engine ${engine}:`, e);
        fallbackToNextEngine(url);
    }
}

async function selectChannel(channel, pushHistory = true) {
    const ytLink = ytChannelLinkOf(channel);
    if (ytLink) { openYouTubeChannel(ytLink); return; }
    const links = parseChannelLinks(channel);
    if (!links.length) {
        toast('لا يوجد رابط بث صالح لهذه القناة');
        return;
    }
    currentChannelId = channel.id;
    currentChannelLinks = links;
    currentLinkIndex = 0;
    currentQualityIndex = 0;
    currentQualityMode = 'links';
    setupQualityButtons(links, 'links');
    
    // عند فتح القناة، نحافظ على وجود المستخدم في القسم الحالي
    showPlayer(pushHistory);
    
    // Smart play: prefer YouTube, then m3u8, then mp4, else fallback to trying engines in parallel
    playSmart(links);
}

function playSmart(links) {
    if (!links || !links.length) return;
    // find YouTube link
    const yt = links.find(l => /(?:youtube\.com|youtu\.be)/i.test(l.url || ''));
    if (yt) {
        currentLinkIndex = links.indexOf(yt);
        currentQualityMode = 'links';
        currentQualityIndex = currentLinkIndex;
        setPlayerSource(yt.url, 'youtube', false);
        setupQualityButtons(links, 'links');
        return;
    }
    // find m3u8
    const hls = links.find(l => l.url && l.url.includes('.m3u8'));
    if (hls) {
        currentLinkIndex = links.indexOf(hls);
        currentQualityMode = 'links';
        currentQualityIndex = currentLinkIndex;
        const preferred = getPreferredPlayerEngine(hls.url) || 'videojs';
        setPlayerSource(hls.url, preferred, false);
        setupQualityButtons(links, 'links');
        return;
    }
    // find mp4
    const mp4 = links.find(l => l.url && l.url.match(/\.mp4($|\?)/i));
    if (mp4) {
        currentLinkIndex = links.indexOf(mp4);
        currentQualityMode = 'links';
        currentQualityIndex = currentLinkIndex;
        setPlayerSource(mp4.url, 'videojs', false);
        setupQualityButtons(links, 'links');
        return;
    }
    // fallback: try multiple engines in parallel on the first link
    tryEnginesInParallel(links[0].url, 5);
}

function ytParseHash(part) {
    if (!part) return null;
    const bits = part.split('.');
    return bits[0] ? { ch: bits[0], pl: bits[1] || '', solo: bits[2] === 's' } : null;
}

function ytParseChannelUrl(url) {
    try {
        const u = new URL(String(url).trim());
        if (!/(^|\.)youtube\.com$/i.test(u.hostname)) return null;
        const seg = u.pathname.split('/').filter(Boolean);
        if (!seg.length) return null;
        if (seg[0] === 'playlist' && u.searchParams.get('list')) return { playlistId: u.searchParams.get('list') };
        if (seg[0].startsWith('@')) return { forHandle: decodeURIComponent(seg[0]) };
        if (seg[0] === 'channel' && seg[1]) return { id: seg[1] };
        if (seg[0] === 'user' && seg[1]) return { forUsername: decodeURIComponent(seg[1]) };
        if (seg[0] === 'c' && seg[1]) return { forHandle: '@' + decodeURIComponent(seg[1]) };
    } catch (e) {}
    return null;
}

// يرجع رابط قناة يوتيوب إن كانت هذه "قناة" من نوع قناة يوتيوب، وإلا null
function ytChannelLinkOf(ch) {
    if (!ch) return null;
    const l = parseChannelLinks(ch).find(x => ytParseChannelUrl(x.url));
    return l ? l.url : null;
}

async function ytCachedRaw(key, loader) {
    const k = 'yt:' + key;
    try {
        const raw = localStorage.getItem(k);
        if (raw) { const o = JSON.parse(raw); if (Date.now() - o.t < YT_TTL) return o.v; }
    } catch (e) {}
    const v = await loader();
    try { localStorage.setItem(k, JSON.stringify({ t: Date.now(), v })); } catch (e) {}
    return v;
}
function ytCached(key, loader) {
    if (ytInflight[key]) return ytInflight[key];
    const p = ytCachedRaw(key, loader).finally(() => { delete ytInflight[key]; });
    ytInflight[key] = p;
    return p;
}

async function ytApi(path, params) {
    const q = new URLSearchParams({ key: YT_API_KEY });
    Object.keys(params).forEach(k => { if (params[k] !== '' && params[k] != null) q.set(k, params[k]); });
    const r = await fetch('https://www.googleapis.com/youtube/v3/' + path + '?' + q.toString());
    let j;
    try { j = await r.json(); } catch (e) { throw new Error('تعذر الاتصال بيوتيوب'); }
    if (j.error) throw new Error(j.error.message || 'خطأ من يوتيوب');
    return j;
}

function ytThumb(t) {
    if (!t) return '';
    return (t.medium || t.high || t.standard || t.default || {}).url || '';
}

async function ytFetchChannel(params) {
    const j = await ytApi('channels', Object.assign({ part: 'snippet,statistics,brandingSettings' }, params));
    const c = (j.items || [])[0];
    if (!c) throw new Error('لم يتم العثور على القناة');
    const banner = (c.brandingSettings && c.brandingSettings.image && c.brandingSettings.image.bannerExternalUrl) || '';
    return { id: c.id, title: c.snippet.title, thumb: ytThumb(c.snippet.thumbnails), banner, videoCount: c.statistics && c.statistics.videoCount != null ? Number(c.statistics.videoCount) : null };
}

function ytResolveChannelLink(url) {
    const p = ytParseChannelUrl(url);
    if (!p) return Promise.reject(new Error('رابط قناة غير صالح'));
    // رابط قائمة تشغيل: تُفتح القائمة وحدها (وليس القناة كاملة)
    if (p.playlistId) {
        return ytCached('chl:' + url, async () => {
            const j = await ytApi('playlists', { part: 'snippet', id: p.playlistId });
            const pl = (j.items || [])[0];
            if (!pl) throw new Error('لم يتم العثور على قائمة التشغيل');
            // صورة وغلاف القناة صاحبة القائمة (وليس صورة القائمة)
            const c = await ytGetChannel(pl.snippet.channelId);
            return { id: c.id, pl: p.playlistId, title: pl.snippet.title, thumb: c.thumb, banner: c.banner, videoCount: null };
        });
    }
    return ytCached('chl:' + url, () => ytFetchChannel(p));
}
function ytGetChannel(id) {
    return ytCached('ch2:' + id, () => ytFetchChannel({ id }));
}

function ytGetPlaylists(channelId) {
    return ytCached('pl:' + channelId, async () => {
        const out = [];
        let token = '';
        do {
            const j = await ytApi('playlists', { part: 'snippet,contentDetails', channelId, maxResults: 50, pageToken: token });
            (j.items || []).forEach(p => {
                if (p.contentDetails && p.contentDetails.itemCount === 0) return;
                out.push({ id: p.id, title: p.snippet.title, thumb: ytThumb(p.snippet.thumbnails), count: p.contentDetails ? p.contentDetails.itemCount : 0 });
            });
            token = j.nextPageToken || '';
        } while (token);
        // ترتيب صاحب القناة: قوائم أقسام القناة الرئيسية أولاً بترتيبها، ثم باقي القوائم
        try {
            const s = await ytApi('channelSections', { part: 'contentDetails', channelId });
            const order = [];
            (s.items || []).forEach(sec => {
                ((sec.contentDetails && sec.contentDetails.playlists) || []).forEach(id => { if (!order.includes(id)) order.push(id); });
            });
            if (order.length) {
                const rank = (p, i) => { const k = order.indexOf(p.id); return k === -1 ? order.length + i : k; };
                return out.map((p, i) => ({ p, r: rank(p, i) })).sort((a, b) => a.r - b.r).map(x => x.p);
            }
        } catch (e) {}
        return out;
    });
}

// يجلب عناصر قائمة تشغيل (حتى YT_MAX_VIDEOS). notFoundOk: القائمة غير الموجودة تعطي قائمة فارغة بدل خطأ
async function ytFetchPlaylistItems(playlistId, notFoundOk) {
    const out = [];
    let token = '';
    try {
        do {
            const j = await ytApi('playlistItems', { part: 'snippet,contentDetails', playlistId, maxResults: 50, pageToken: token });
            (j.items || []).forEach(it => {
                const t = it.snippet.title;
                if (t === 'Private video' || t === 'Deleted video') return;
                out.push({ id: it.contentDetails.videoId, title: t, thumb: ytThumb(it.snippet.thumbnails), date: it.contentDetails.videoPublishedAt || '' });
            });
            token = j.nextPageToken || '';
        } while (token && out.length < YT_MAX_VIDEOS);
    } catch (e) {
        if (notFoundOk && /playlistNotFound|not\s*found|cannot\s*be\s*found/i.test(String(e && e.message))) return [];
        throw e;
    }
    return out;
}

function ytGetVideos(playlistId) {
    return ytCached('vid:' + playlistId, async () => {
        // "كل الفيديوهات" = الفيديوهات الطويلة (UULF) + البثوث المباشرة المسجلة (UULV) بدون الشورتس، الأحدث أولاً
        if (/^UULF/.test(playlistId)) {
            const [lf, lv] = await Promise.all([
                ytFetchPlaylistItems(playlistId, true),
                ytFetchPlaylistItems('UULV' + playlistId.slice(4), true).catch(() => [])
            ]);
            const seen = new Set();
            return lf.concat(lv)
                .filter(v => !seen.has(v.id) && seen.add(v.id))
                .sort((x, y) => (y.date > x.date ? 1 : y.date < x.date ? -1 : 0))
                .slice(0, YT_MAX_VIDEOS);
        }
        return ytFetchPlaylistItems(playlistId, false);
    });
}

function ytMakeCard(imgUrl, title, sub, onClick, extraClass) {
    const card = document.createElement('div');
    card.className = 'card yt-card' + (extraClass ? ' ' + extraClass : '');
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = imgUrl || DEFAULT_IMAGE;
    img.onerror = () => { img.onerror = null; img.src = DEFAULT_IMAGE; };
    const t = document.createElement('div');
    t.className = 'card-title yt-card-title';
    t.textContent = title || '';
    card.appendChild(img);
    card.appendChild(t);
    if (sub) {
        const s = document.createElement('div');
        s.className = 'yt-card-sub';
        s.textContent = sub;
        card.appendChild(s);
    }
    card.onclick = (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } onClick(); };
    return card;
}

                .map(it => ({ id: it.contentDetails.videoId, title: it.snippet.title }));
        } catch (e) {
            if (/playlistNotFound|not\s*found|cannot\s*be\s*found/i.test(String(e && e.message))) return [];
            throw e;
        }
    });
}

function ytShortsRow(ch, shorts) {
    const wrap = document.createElement('div');

    const head = document.createElement('div');
    head.className = 'yt-shorts-head';
    const h = document.createElement('div');
    h.className = 'yt-shorts-title';
    h.textContent = 'الشورتس';
    const all = document.createElement('button');
    all.type = 'button';
    all.className = 'yt-shorts-all';
    all.textContent = 'عرض الكل';
    all.onclick = (e) => {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        window.ytNav = { ch: ch.id, pl: ytShortsPlaylistId(ch.id) };
        pushState();
        renderCurrentView();
        window.scrollTo(0, 0);
    };
    head.appendChild(h);
    head.appendChild(all);

    list.forEach((v, i) => {

// ===== عارض الشورتس العمودي (مثل يوتيوب): تمرير لأعلى/لأسفل للانتقال بين الشورتس =====
const ytSv = { list: [], idx: 0, channelId: '', loadedAll: false, loading: false, timer: null, observer: null, pushed: false };
window.ytShortsOpen = false;
window.ytShortsSkipPop = false;

function ytSvEl() {
    let v = document.getElementById('ytShortsViewer');
    if (v) return v;
    v = document.createElement('div');
    v.id = 'ytShortsViewer';
    v.className = 'yt-sv hidden';
    v.innerHTML = '<button type="button" class="yt-sv-close" aria-label="إغلاق">&#10005;</button>' +
        '<div class="yt-sv-feed"></div>' +
        '<div class="yt-sv-nav"><button type="button" class="yt-sv-prev" aria-label="السابق">&#9650;</button>' +
        '<button type="button" class="yt-sv-next" aria-label="التالي">&#9660;</button></div>';
    document.body.appendChild(v);
    v.querySelector('.yt-sv-close').onclick = () => ytCloseShortsViewer(true);
    v.querySelector('.yt-sv-prev').onclick = () => ytSvGo(-1);
    v.querySelector('.yt-sv-next').onclick = () => ytSvGo(1);
    document.addEventListener('keydown', (e) => {
        if (!window.ytShortsOpen) return;
        if (e.key === 'Escape') ytCloseShortsViewer(true);
        else if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); ytSvGo(1); }
        else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); ytSvGo(-1); }
    });
    return v;
}

function ytSvGo(step) {
    const feed = ytSvEl().querySelector('.yt-sv-feed');
    const next = Math.max(0, Math.min(ytSv.list.length - 1, ytSv.idx + step));
    feed.scrollTo({ top: next * feed.clientHeight, behavior: 'smooth' });
}

function ytSvAddSlides(items, startIndex) {
    const feed = ytSvEl().querySelector('.yt-sv-feed');
    items.forEach((v, k) => {
        const slide = document.createElement('div');
        slide.className = 'yt-sv-slide';
        slide.dataset.i = String(startIndex + k);
        const box = document.createElement('div');
        box.className = 'yt-sv-box';
        const img = document.createElement('img');
        img.className = 'yt-sv-poster';
        img.alt = '';
        img.src = v.thumb;
        const t = document.createElement('div');
        t.className = 'yt-sv-title';
        t.textContent = v.title || '';
        box.appendChild(img);
        box.appendChild(t);
        slide.appendChild(box);
        feed.appendChild(slide);
        if (ytSv.observer) ytSv.observer.observe(slide);
    });
}

// يشغّل الشورت الحالي فقط ويُفرغ البقية حتى لا يتداخل الصوت ولا تُحمَّل عشرات الإطارات
function ytSvActivate(i) {
    const feed = ytSvEl().querySelector('.yt-sv-feed');
    ytSv.idx = i;
    feed.querySelectorAll('.yt-sv-slide').forEach(sl => {
        const box = sl.firstChild;
        const fr = box.querySelector('iframe');
        if (Number(sl.dataset.i) === i) {
            if (!fr) {
                const id = ytSv.list[i].id;
                const f = document.createElement('iframe');
                f.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&playsinline=1&rel=0&loop=1&playlist=' + id + '&modestbranding=1';
                f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
                f.setAttribute('allowfullscreen', '');
                f.setAttribute('frameborder', '0');
                box.appendChild(f);
                box.classList.add('has-frame');
            }
        } else if (fr) {
            fr.remove();
            box.classList.remove('has-frame');
        }
    });
    ytSvLoadMore();
}

// عند الاقتراب من نهاية صف المعاينة نحمّل بقية شورتس القناة ونلحقها بالعارض
function ytSvLoadMore() {
    if (!ytSv.channelId || ytSv.loadedAll || ytSv.loading) return;
    if (ytSv.idx < ytSv.list.length - 3) return;
    ytSv.loading = true;
    const pid = ytShortsPlaylistId(ytSv.channelId);
    ytGetVideos(pid).then(all => {
        const seen = new Set(ytSv.list.map(x => x.id));
        const extra = all.filter(v => !seen.has(v.id)).map(v => ({ id: v.id, title: v.title, thumb: ytShortThumb(v.id) }));
        const start = ytSv.list.length;
        ytSv.list = ytSv.list.concat(extra);
        if (window.ytShortsOpen && extra.length) ytSvAddSlides(extra, start);
    }).catch(() => {}).finally(() => { ytSv.loading = false; ytSv.loadedAll = true; });
}

function ytOpenShortsViewer(list, startIndex, channelId) {
    if (!list || !list.length) return;
    const v = ytSvEl();
    const feed = v.querySelector('.yt-sv-feed');
    feed.innerHTML = '';
    ytSv.list = list.slice();
    ytSv.channelId = channelId || '';
    ytSv.loadedAll = !channelId;
    ytSv.loading = false;
    if (ytSv.observer) ytSv.observer.disconnect();
    ytSv.observer = new IntersectionObserver((entries) => {
        entries.forEach(en => {
            if (!en.isIntersecting) return;
            const i = Number(en.target.dataset.i);
            clearTimeout(ytSv.timer);
            // تأخير بسيط حتى لا نحمّل إطاراً أثناء التمرير السريع
            ytSv.timer = setTimeout(() => { ytSvActivate(i); }, 220);
        });
    }, { root: feed, threshold: 0.7 });
    ytSvAddSlides(ytSv.list, 0);
    v.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    window.ytShortsOpen = true;
    // زر الرجوع في المتصفح/الجوال يغلق العارض فقط
    try { window.history.pushState(window.history.state, '', window.location.href); ytSv.pushed = true; } catch (e) { ytSv.pushed = false; }
    const i0 = Math.max(0, Math.min(ytSv.list.length - 1, startIndex || 0));
    requestAnimationFrame(() => {
        feed.scrollTop = i0 * feed.clientHeight;
        ytSvActivate(i0);
    });
}

function ytCloseShortsViewer(viaButton) {
    const v = document.getElementById('ytShortsViewer');
    clearTimeout(ytSv.timer);
    if (ytSv.observer) { ytSv.observer.disconnect(); ytSv.observer = null; }
    if (v) {
        v.querySelectorAll('iframe').forEach(f => f.remove());
        v.classList.add('hidden');
        const feed = v.querySelector('.yt-sv-feed');
        if (feed) feed.innerHTML = '';
    }
    document.body.style.overflow = '';
    const wasOpen = window.ytShortsOpen;
    window.ytShortsOpen = false;
    if (viaButton && wasOpen && ytSv.pushed) { window.ytShortsSkipPop = true; window.history.back(); }
    ytSv.pushed = false;
}

function ytBannerEl(url) {
    const d = document.createElement('div');
    d.className = 'yt-banner';

    // اقتصاص المنطقة الآمنة للغلاف، وإن فشل نستخدم الصورة كاملة، وإن فشلت أيضاً يُحذف الغلاف
    img.onerror = () => { if (!retried) { retried = true; img.src = url + '=w1280'; } else { d.remove(); } };
    img.src = url + '=w1280-fcrop64=1,00005a57ffffa5a8-k-c0xffffffff-no-nd-rj';

async function renderYouTubeView() {
    const grid = $('grid');
    if (!grid || !window.ytNav) return;
    const nav = window.ytNav;
    const token = ++ytRenderToken;
    ytMessage(grid, 'جاري التحميل...');
    const isShortsView = ytIsShortsPlaylist(nav.pl);
    grid.classList.toggle('yt-shorts', isShortsView);
    // صف الشورتس يُجلب بالتوازي مع القنوات والقوائم، وأي فشل فيه يخفيه فقط
    const shortsP = nav.pl ? null : ytGetShortsPreview(nav.ch).catch(() => []);
    try {
        const ch = await ytGetChannel(nav.ch);
        const realPls = await ytGetPlaylists(nav.ch);
        const shorts = shortsP ? await shortsP : [];
        if (token !== ytRenderToken) return;
        // قائمة "كل الفيديوهات" = فيديوهات القناة وبثوثها بدون الشورتس (UULF + UULV)، حتى لو ليست في أي قائمة
        const all = [];
        if (/^UC/.test(nav.ch)) all.push({ id: 'UULF' + nav.ch.slice(2), title: 'كل الفيديوهات', thumb: ch.thumb, count: null });
        const pls = all.concat(realPls);
        const frag = document.createDocumentFragment();

        if (!nav.pl) {
            // مستوى قوائم التشغيل
            if (!pls.length) { ytMessage(grid, 'لا توجد قوائم تشغيل في هذه القناة'); return; }
            if (ch.banner) frag.appendChild(ytBannerEl(ch.banner));
            frag.appendChild(ytTitleBar(ch.title));
            if (shorts.length) frag.appendChild(ytShortsRow(ch, shorts));
            pls.forEach(p => {
                frag.appendChild(ytMakeCard(p.thumb, p.title, (p.count != null ? p.count + ' فيديو' : ''), () => {
                    window.ytNav = { ch: nav.ch, pl: p.id };
                    pushState();
                    renderCurrentView();
                    window.scrollTo(0, 0);
                }));
            });
        } else {
            // مستوى فيديوهات القائمة
            const pl = pls.find(p => p.id === nav.pl);
            let vids = [];
            try { vids = await ytGetVideos(nav.pl); }
            catch (err) { if (!/playlistNotFound|not\s*found|cannot\s*be\s*found/i.test(String(err && err.message))) throw err; }
            if (token !== ytRenderToken) return;
            if (!vids.length) { ytMessage(grid, 'لا توجد فيديوهات متاحة في هذه القائمة'); return; }
            if (nav.solo && ch.banner) frag.appendChild(ytBannerEl(ch.banner));
            frag.appendChild(ytTitleBar((isShortsView ? 'الشورتس' : (pl ? pl.title : 'قائمة التشغيل')) + ' - ' + ch.title));
            const shortsList = isShortsView ? vids.map(v => ({ id: v.id, title: v.title, thumb: ytShortThumb(v.id) })) : null;
            vids.forEach((v, i) => {
                if (isShortsView) {
                    frag.appendChild(ytMakeCard(shortsList[i].thumb, v.title, '', () => ytOpenShortsViewer(shortsList, i, ''), 'yt-short'));
                } else {
                    frag.appendChild(ytMakeCard(v.thumb, v.title, '', () => ytPlayVideo(v)));
                }
            });
        }
        grid.innerHTML = '';
        grid.appendChild(frag);
    } catch (e) {
        if (token !== ytRenderToken) return;
        console.warn('YouTube error', e);
        ytMessage(grid, 'تعذر جلب البيانات من يوتيوب: ' + (e && e.message ? e.message : ''));
    }
}

// يجلب صورة القناة تلقائياً لكرت قناة يوتيوب إذا لم تُحدَّد صورة من لوحة التحكم
function ytEnhanceCard(card, ch) {
    if (ch.img && !(ch.ytPlaylistId && ch.source === 'youtube-sync')) return;
    const link = ytChannelLinkOf(ch);
    if (!link) return;
    const img = card.querySelector('img');
    ytResolveChannelLink(link).then(info => { if (img && info.thumb) img.src = info.thumb; }).catch(() => {});
}
// ================== نهاية قسم قنوات يوتيوب ==================

// تهريب النصوص القادمة من قاعدة البيانات (أسماء قادمة من يوتيوب أو لوحة التحكم) قبل وضعها في innerHTML
function escapeHtml(value) {
    return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, ch => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
    ));
}

function createCategoryCard(cat) {
    const card = document.createElement('div');
    card.className = 'card category-card';
    card.innerHTML = `<img class="category-img" src="${escapeHtml(cat.img || DEFAULT_IMAGE)}" onerror="this.src='${DEFAULT_IMAGE}'"><div class="category-title">${escapeHtml(cat.name)}</div>`;
    card.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (openCategoryLink(cat)) return;
        const id = String(cat.id);
        
        // التحقق من عدم الانتقال لنفس القسم
        if (currentStack.length > 0 && currentStack[currentStack.length - 1] === id) {
            return;
        }
        
        // إضافة القسم الجديد للـ Stack
        currentStack.push(id);
        pushState();
        renderCurrentView();
    };
    return card;
}

async function renderCurrentView() {
    const grid = $('grid');
    if (!grid) return;

    // عرض قنوات يوتيوب (قوائم التشغيل / الفيديوهات)
    const inYt = !!(window.ytNav && window.ytNav.ch);
    grid.classList.toggle('yt-wide', inYt);
    if (!inYt) grid.classList.remove('yt-shorts');
    if (inYt) { renderYouTubeView(); return; }

    // 1. تحديد المعرف الحالي بدقة
    let currentId = (currentStack && currentStack.length > 0) ? String(currentStack[currentStack.length - 1]) : null;
    if (!currentId || currentId === "" || currentId === "null" || currentId === "undefined" || currentId === "0") {
        currentId = null;
    }

    // التأكد من وجود بيانات
    const allCategories = Object.values(categoriesCache || {});
    if (allCategories.length === 0) {
        grid.innerHTML = '<div class="empty-section-msg">جاري تحميل البيانات من قاعدة البيانات...</div>';
        return;
    }

    // نبني المحتوى في Fragment أولاً لتفادي وميض الشاشة الفارغة
    const frag = document.createDocumentFragment();

    // --- الصفحة الرئيسية ---
    if (currentId === null) {
        let roots = allCategories.filter(c => {
            const pid = normalizeParentId(c.parentId);
            return !pid || pid === "" || !categoriesCache[pid];
        });
        const toDisplay = roots.length > 0 ? roots : allCategories;
        toDisplay.forEach(cat => frag.appendChild(createCategoryCard(cat)));
        // استبدال محتوى الشبكة دفعة واحدة
        grid.innerHTML = '';
        grid.appendChild(frag);
        return;
    }

    // --- داخل قسم معين ---
    if (!categoriesCache[currentId]) {
        currentStack = [];
        window.history.replaceState({ 
            path: 'navigation', 
            stack: [], 
            channelId: null, 
            viewMode: 'home', 
            externalUrl: '' 
        }, '', '#');
        return renderCurrentView();
    }

    const subs = allCategories.filter(c => normalizeParentId(c.parentId) === String(currentId));
    subs.forEach(sub => frag.appendChild(createCategoryCard(sub)));

    const channels = (channelsCache || []).filter(ch => {
        const cids = getChannelCategoryIds(ch);
        return cids.includes(String(currentId));
    });

    channels.forEach(ch => {
        const card = document.createElement('div');
        card.className = 'card channel-card';
        card.innerHTML = `<img src="${escapeHtml(getChannelCardImage(ch))}" onerror="this.src='${DEFAULT_IMAGE}'"><div class="card-title">${escapeHtml(ch.name)}</div>`;
        card.onclick = (e) => {
            if (e) e.preventDefault();
            selectChannel(ch);
        };
        ytEnhanceCard(card, ch);
        frag.appendChild(card);
    });

    grid.innerHTML = '';
    if (subs.length === 0 && channels.length === 0) {
        grid.innerHTML = '<div class="empty-section-msg">عذراً، هذا القسم لا يحتوي على محتوى حالياً</div>';
    } else {
        grid.appendChild(frag);
    }
}

function performSearch(query) {
    const grid = $('grid');
    if (!grid) return;
    const q = String(query || '').trim().toLowerCase();
    if (!q) { 
        renderCurrentView(); 
        return; 
    }
    grid.innerHTML = '';
    const categories = Object.values(categoriesCache || {}).filter(c => (c.name || '').toLowerCase().includes(q));
    const channels = (channelsCache || []).filter(ch => (ch.name || '').toLowerCase().includes(q) || (ch.tags || '').toString().toLowerCase().includes(q));

    if (!categories.length && !channels.length) {
        grid.innerHTML = '<div class="empty-section-msg">لم يتم العثور على نتائج</div>';
        return;
    }

    if (categories.length) {
        const header = document.createElement('div');
        header.className = 'empty-section-msg';
        header.textContent = 'الأقسام المطابقة';
        grid.appendChild(header);
        categories.forEach(cat => {
            grid.appendChild(createCategoryCard(cat));
        });
    }

    if (channels.length) {
        const header = document.createElement('div');
        header.className = 'empty-section-msg';
        header.textContent = 'القنوات المطابقة';
        grid.appendChild(header);
        channels.forEach(ch => {
            const card = document.createElement('div');
            card.className = 'card channel-card';
            card.innerHTML = `<img src="${escapeHtml(getChannelCardImage(ch))}" onerror="this.src='${DEFAULT_IMAGE}'"><div class="card-title">${escapeHtml(ch.name)}</div>`;
            card.onclick = () => selectChannel(ch);
            ytEnhanceCard(card, ch);
            grid.appendChild(card);
        });
    }
}

let playerControlsTimer = null;
function showPlayerControls() {
    const qButtons = $('qualityButtons');
    const qMenu = $('qualityMenu');
    if (qButtons) qButtons.classList.add('show');
    if (qMenu) qMenu.classList.add('show');

    if (playerControlsTimer) clearTimeout(playerControlsTimer);
    playerControlsTimer = setTimeout(() => {
        if (qButtons) qButtons.classList.remove('show');
        if (qMenu) qMenu.classList.remove('show');
    }, 3000);
}

function initVideoPlayer() {
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && $('playerContainer') && !$('playerContainer').classList.contains('hidden')) {
            hidePlayer();
        }
    });

    const playerContainer = $('playerContainer');
    if (playerContainer) {
        ['mousemove', 'touchstart', 'click'].forEach(evt => {
            playerContainer.addEventListener(evt, showPlayerControls);
        });
    }

    const engineSelect = $('playerEngineSelect');
    if (engineSelect) {
        engineSelect.addEventListener('change', () => {
            if (currentChannelLinks && currentChannelLinks.length > 0) {
                const engine = engineSelect.value;
                if (engine !== 'auto') {
                    currentLinkIndex = 0;
                    currentQualityIndex = 0;
                    attemptedFallbacks[engine] = false; 
                    setTimeout(() => {
                        setPlayerSource(currentChannelLinks[0].url, engine, false);
                        setupQualityButtons(currentChannelLinks, 'links');
                    }, 150);
                } else {
                    currentLinkIndex = 0;
                    currentQualityIndex = 0;
                    Object.keys(attemptedFallbacks).forEach(k => attemptedFallbacks[k] = false);
                    setTimeout(() => {
                        setPlayerSource(currentChannelLinks[0].url, getPreferredPlayerEngine(currentChannelLinks[0].url), false);
                        setupQualityButtons(currentChannelLinks, 'links');
                    }, 150);
                }
            }
        });
    }
}

function normalizeParentId(value) {
    if (value === null || value === undefined) return '';
    const str = String(value).trim();
    if (!str) return '';
    const cleaned = str.toLowerCase();
    if (['null', 'undefined', 'false', '0'].includes(cleaned)) return '';
    return str;
}

async function refreshCategoriesCache() {
    try {
        const catSnap = await database.ref('categories').once('value');
        const map = {};
        catSnap.forEach(c => {
            map[c.key] = {
                id: c.key,
                ...c.val(),
                parentId: normalizeParentId(c.val().parentId)
            };
        });
        categoriesCache = map;
    } catch (error) { categoriesCache = {}; }
}

async function refreshChannelsCache() {
    try {
        const chanSnap = await database.ref('channels').once('value');
        const list = [];
        chanSnap.forEach(ch => { list.push({ id: ch.key, ...ch.val() }); });
        channelsCache = list;
    } catch (error) { channelsCache = []; }
}

async function init() {
    if (appInitialized) return;
    appInitialized = true;
    
    // منع ظهور صفحة البداية عند التحديث أو الرجوع في نفس الجلسة (القرار يُتخذ في سكربت الـ head قبل الرسم)
    const isReturning = window.__showSplash === false;
    const splash = document.getElementById('splash-screen');
    
    if (isReturning && splash) {
        splash.style.display = 'none';
        document.body.style.overflow = '';
    } else {
        document.body.style.overflow = 'hidden';
        setTimeout(enterSite, 5000);
    }
    
    initVideoPlayer();
    
    // تحميل البيانات الأولية مرة واحدة والانتظار
    await Promise.all([refreshCategoriesCache(), refreshChannelsCache()]);

    // استعادة الحالة من الرابط (Hash)
    const hashState = restoreHashState();
    
    // تحديث المتغيرات العالمية قبل أي عملية عرض
    currentStack = Array.isArray(hashState.stack) ? [...hashState.stack] : [];
    currentChannelId = hashState.channelId || null;
    window.currentViewMode = hashState.viewMode || 'home';
    window.currentExternalUrl = hashState.externalUrl || '';
    window.ytNav = hashState.yt || null;

    // تهيئة التاريخ بذكاء لمنع التحديث عند الرجوع
    const isAtHome = currentStack.length === 0 && !currentChannelId && window.currentViewMode === 'home' && !window.ytNav;
    
    if (!window.history.state) {
        if (!isAtHome) {
            window.history.replaceState({ path: 'navigation', stack: [], channelId: null, viewMode: 'home', externalUrl: '' }, '', '#');
            window.history.pushState({ 
                path: 'navigation', 
                stack: [...currentStack], 
                channelId: currentChannelId, 
                viewMode: window.currentViewMode, 
                externalUrl: window.currentExternalUrl 
            }, '', window.location.hash || '#');
        } else {
            window.history.replaceState({ 
                path: 'navigation', 
                stack: [], 
                channelId: null, 
                viewMode: 'home', 
                externalUrl: '' 
            }, '', '#');
        }
    }

    // التحقق من أن القناة الحالية موجودة بالفعل
    if (currentChannelId && !findChannelById(currentChannelId)) {
        currentChannelId = null;
    }

    // التحقق من أن الأقسام الموجودة في Stack موجودة بالفعل
    currentStack = currentStack.filter(id => categoriesCache[id]);

    // تطبيق العرض بناءً على الحالة المستعادة
    applyViewMode();
    await renderCurrentView();

    // تشغيل القناة إذا كانت موجودة في الرابط
    if (currentChannelId) {
        const channel = findChannelById(currentChannelId);
        if (channel) await selectChannel(channel, false);
    }

    // 5. تفعيل التحديثات التلقائية (Real-time Sync) - دون تحديث عند المشغل
    database.ref('categories').on('value', (snapshot) => {
        const map = {};
        snapshot.forEach(c => {
            map[c.key] = {
                id: c.key,
                ...c.val(),
                parentId: normalizeParentId(c.val().parentId)
            };
        });
        categoriesCache = map;
        // تحديث العرض فقط إذا لم نكن في المشغل
        if (!currentChannelId && !(window.ytNav && window.ytNav.ch)) renderCurrentView();
    });

    database.ref('channels').on('value', (snapshot) => {
        const list = [];
        snapshot.forEach(ch => { list.push({ id: ch.key, ...ch.val() }); });
        channelsCache = list;
        // تحديث العرض فقط إذا لم نكن في المشغل
        if (!currentChannelId && !(window.ytNav && window.ytNav.ch)) renderCurrentView();
    });
}

function openSidebar() { document.body.classList.add('sidebar-open'); }
function closeSidebar() { document.body.classList.remove('sidebar-open'); }

function hideLightbox() {
    const lightbox = $('lightbox-alert');
    if (lightbox) {
        lightbox.style.display = 'none';
        localStorage.setItem('lightboxHidden', 'true');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('lightboxHidden') === 'true') {
        const lightbox = $('lightbox-alert');
        if (lightbox) lightbox.style.display = 'none';
    }

    const qualityToggle = $('qualityToggle');
    if (qualityToggle) qualityToggle.addEventListener('click', toggleQualityMenu);
    const sidebarToggle = $('sidebarToggle');
    if (sidebarToggle) sidebarToggle.addEventListener('click', (event) => {
        event.stopPropagation();
        if (document.body.classList.contains('sidebar-open')) closeSidebar(); else openSidebar();
    });
    const searchToggle = $('searchToggle');
    const headerSearch = $('headerSearch');
    if (searchToggle && headerSearch) {
        searchToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            headerSearch.classList.toggle('visible');
            if (headerSearch.classList.contains('visible')) { headerSearch.focus(); headerSearch.select(); }
            else { headerSearch.value = ''; renderCurrentView(); }
        });
        headerSearch.addEventListener('input', (e) => performSearch(e.target.value));
        headerSearch.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { headerSearch.classList.remove('visible'); headerSearch.value = ''; renderCurrentView(); }
            if (e.key === 'Enter') { performSearch(headerSearch.value); }
        });
        document.addEventListener('click', (ev) => { if (!headerSearch.contains(ev.target) && ev.target !== searchToggle) { headerSearch.classList.remove('visible'); } });
    }
    const sidebarOverlay = $('sidebarOverlay');
    if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);
    const installBtn = $('installBtn');
    window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        if (installBtn) installBtn.classList.remove('hidden');
    });
    if (installBtn) {
        installBtn.addEventListener('click', async () => {
            if (!deferredInstallPrompt) return;
            deferredInstallPrompt.prompt();
            const choiceResult = await deferredInstallPrompt.userChoice;
            deferredInstallPrompt = null;
            installBtn.classList.add('hidden');
        });
    }
    if ('serviceWorker' in navigator) {
        const swCode = `
            const CACHE_NAME = 'alfaham-tv-cache-v1';
            const ASSETS = ['/', 'index.html', 'admin.html'];
            self.addEventListener('install', event => {
                event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(ASSETS)));
                self.skipWaiting();
            });
            self.addEventListener('activate', event => {
                event.waitUntil(caches.keys().then(keys => Promise.all(
                    keys.filter(key => key !== CACHE_NAME).map(key => caches.delete(key))
                )));
                self.clients.claim();
            });
            self.addEventListener('fetch', event => {
                if (event.request.method !== 'GET') return;
                event.respondWith(
                    caches.match(event.request).then(cachedResponse => {
                        if (cachedResponse) return cachedResponse;
                        return fetch(event.request).then(networkResponse => {
                            if (!networkResponse || networkResponse.status !== 200 || networkResponse.type !== 'basic') return networkResponse;
                            const responseClone = networkResponse.clone();
                            caches.open(CACHE_NAME).then(cache => cache.put(event.request, responseClone));
                            return networkResponse;
                        }).catch(() => caches.match('index.html'));
                    })
                );
            });
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(err => console.warn('SW registration failed:', err));
    }
    const homeNav = $('homeNav');
    const matchesNav = $('matchesNav');
    if (homeNav && matchesNav) {
        const goToHome = () => {
            // إفراغ الستاك والعودة لعرض الأقسام الجذرية
            currentStack = [];
            currentChannelId = null;
            window.ytNav = null;
            window.currentViewMode = 'home'; 
            window.currentExternalUrl = '';
            homeNav.classList.add('active'); 
            matchesNav.classList.remove('active');
            if ($('grid')) $('grid').classList.remove('hidden');
            if ($('matchesTableContainer')) $('matchesTableContainer').classList.add('hidden');
            if ($('externalLinkContainer')) $('externalLinkContainer').classList.add('hidden');

            // إخفاء المشغل إن كان ظاهراً
            if (currentChannelId) hidePlayer();

            // تحديث الواجهة وحالة التاريخ
            applyViewMode();
            try { renderCurrentView(); } catch(e) { console.warn('renderCurrentView failed in goToHome', e); }
            window.history.replaceState({ 
                path: 'navigation', 
                stack: [...currentStack], 
                channelId: null, 
                viewMode: 'home', 
                externalUrl: '' 
            }, '', '#');
        };
        homeNav.addEventListener('click', goToHome);
        matchesNav.addEventListener('click', () => {
            window.currentViewMode = 'externalLink';
            window.currentExternalUrl = 'https://www.yala-sport-now.com';
            applyViewMode();
            pushState();
        });
    }
});

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

function closeExternalLink() {
    window.currentViewMode = 'home';
    window.currentExternalUrl = '';
    if ($('externalLinkContainer')) $('externalLinkContainer').classList.add('hidden');
    if ($('grid')) $('grid').classList.remove('hidden');
    const homeNav = $('homeNav');
    const matchesNav = $('matchesNav');
    if (homeNav) homeNav.classList.add('active');
    if (matchesNav) matchesNav.classList.remove('active');
    if ($('externalLinkIframe') && $('externalLinkIframe').getAttribute('src')) swapIframe($('externalLinkIframe'), '');
    pushState();
}

function openMatchLink(url) {
    if (!url) return;
    window.currentExternalUrl = url;
    window.currentViewMode = 'externalLink';
    applyViewMode();
    pushState();
}
    </script>
