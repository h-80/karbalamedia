<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>كربلاء ميديا</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap');

:root {
    --primary: #FF6600;
    --accent: #ffd54f;
    --bg-dark: #071824;
    --text-muted: rgba(255,255,255,0.6);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    font-family: 'Cairo', sans-serif;
    background: url('https://h.top4top.io/p_3784nirj21.png') center / cover no-repeat fixed;
    min-height: 100vh;
    margin: 0;
}

.site-header {
    position: fixed;
    top: 0;
    right: 0;
    left: 0;
    z-index: 100000;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    background: rgba(0, 0, 0, 0.78);
    backdrop-filter: blur(14px);
    color: #fff;
}

.site-title {
    font-weight: 700;
    font-size: 18px;
    text-align: center;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    max-width: 60%;
    overflow: hidden;
    text-overflow: ellipsis;
}

.sidebar-toggle,
.nav-item,
.sidebar-close,
.install-btn {
    border: none;
    background: transparent;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
}

.sidebar-toggle {
    font-size: 22px;
    width: 42px;
    height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.install-btn {
    min-width: 88px;
    padding: 8px 12px;
    border: 1px solid rgba(255, 255, 255, 0.32);
    background: rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    transition: background 0.2s ease, transform 0.2s ease;
}

.install-btn:hover {
    background: rgba(255, 255, 255, 0.18);
    transform: translateY(-1px);
}

.search-input {
    width: 0;
    padding: 8px 10px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04);
    color: #fff;
    font-size: 14px;
    transition: width 0.22s ease, opacity 0.22s ease;
    opacity: 0;
}
.search-input.visible {
    width: 220px;
    opacity: 1;
}

#searchToggle {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border-radius: 8px;
    width: 44px;
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    font-size: 18px;
    cursor: pointer;
}
#searchToggle:hover { transform: scale(1.06); }
#searchToggle i { color: #fff; font-size: 16px; }

.site-logo {
    height: 48px;
    width: auto;
    object-fit: contain;
    display: flex;
    align-items: center;
    justify-content: center;
}

.sidebar-overlay {
    position: fixed;
    top: 64px;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.45);
    z-index: 99998;
    display: none;
}

.toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: transparent;
    color: #ffffff;
    padding: 0;
    border-radius: 0;
    font-weight: 700;
    z-index: 100001;
    box-shadow: none;
    max-width: calc(100% - 32px);
    text-align: center;
    pointer-events: none;
}

.card.message-card {
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    box-shadow: none;
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.hidden {
    display: none !important;
}

.sidebar-overlay.hidden {
    display: none;
}

.sidebar {
    position: fixed;
    top: 64px;
    left: 0;
    height: calc(100vh - 64px);
    width: 280px;
    max-width: 85vw;
    background: rgba(0, 0, 0, 0.98);
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 1000001;
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--primary) transparent;
}

.sidebar::-webkit-scrollbar {
    width: 4px;
}

.sidebar::-webkit-scrollbar-track {
    background: transparent;
}

.sidebar::-webkit-scrollbar-thumb {
    background: var(--primary);
    border-radius: 10px;
}

.sidebar-open .sidebar {
    transform: translateX(0);
}

.sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
}

.sidebar-title {
    color: #fff;
    font-size: 18px;
    font-weight: 700;
}

.sidebar-close {
    border: none;
    background: transparent;
    color: #fff;
    font-size: 26px;
    cursor: pointer;
    line-height: 1;
}

.sidebar-open .sidebar-overlay {
    display: block;
}

.sidebar-brand {
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}

.sidebar-logo {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    object-fit: cover;
    display: flex;
    align-items: center;
    justify-content: center;
}

.sidebar-name {
    font-size: 18px;
    font-weight: 800;
    margin-top: 15px;
    color: var(--primary);
}

.sidebar-section {
    padding: 0 20px 20px;
}

.sidebar-section-title {
    font-size: 12px;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-bottom: 15px;
    font-weight: 700;
}

.sidebar-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 15px;
    color: #ffffff;
    text-decoration: none;
    border-radius: 12px;
    transition: all 0.3s ease;
    margin-bottom: 5px;
    font-size: 14px;
    font-weight: 700;
}

.sidebar-link i {
    width: 20px;
    text-align: center;
    font-size: 18px;
    color: #ffffff;
    transition: all 0.3s ease;
}

.sidebar-link:hover,
.sidebar-link:active {
    background: rgba(255, 102, 0, 0.15);
    color: var(--primary);
}

.sidebar-link:hover i,
.sidebar-link:active i {
    color: var(--primary);
}

.nav-item { }

.content-container {
    width: min(100%, 1400px);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding: 94px 16px 100px;
    margin: 0 auto;
    overflow-y: auto;
}

.player-open .site-header,
.player-open .bottom-nav,
.player-open .sidebar,
.player-open .sidebar-overlay,
.player-open .content-container {
    display: none !important;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 110px);
    gap: 8px;
    justify-content: center;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
}

.card {
    background-color: rgba(255, 255, 255, 0.92);
    border-radius: 8px;
    width: 110px;
    padding: 6px;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.2s ease;
    cursor: pointer;
    border: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
}

.card:hover {
    transform: scale(1.05);
}

.card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;
}

.card-title {
    margin-top: 4px;
    font-size: clamp(11px, 1.5vw, 13px);
    color: #000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
    text-align: center;
    font-weight: 700;
}

.player-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-bottom: 72px;
}

.player-container.hidden {
    display: none !important;
}

.matches-table-container,
.external-link-container {
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 0;
    direction: rtl;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 100001;
    background: #000;
}

#matchesIframe,
#externalLinkIframe {
    width: 100%;
    height: 100%;
    background: #fff;
    border: none;
}

.external-link-toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    padding: 12px 18px;
    background: rgba(0, 0, 0, 0.92);
    color: #fff;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: sticky;
    top: 0;
    z-index: 100002;
}

.external-link-title {
    font-weight: 700;
    font-size: 14px;
    color: #ffcc00;
}

.close-embed-btn {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 8px 14px;
    cursor: pointer;
    font-weight: 700;
}

.close-embed-btn:hover {
    background: rgba(255,255,255,0.15);
}

#player-wrapper {
    flex: 1;
    width: 100%;
    min-height: 0;
    background: #000;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.player-engine-control {
    position: absolute;
    bottom: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 16px;
    background: rgba(17, 17, 17, 0.95);
    border-top: 1px solid rgba(255,255,255,0.1);
    width: 100%;
    flex-shrink: 0;
    min-height: 50px;
    z-index: 1000002;
}

.player-engine-control label {
    color: #fff;
    font-weight: 700;
    font-size: 13px;
}

.player-engine-control select {
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    background: #000;
    color: #fff;
    font-size: 13px;
    min-width: 150px;
}

.video-js,
.native-video,
.playerjs-container,
#clappr-container,
#dplayer-container,
#openplayer-container,
#mediachrome-container,
#shaka-video,
#dashjs-video,
#plyr-video,
#mediaelement-video,
#jwplayer-container,
#flowplayer-container {
    width: 100% !important;
    height: 100% !important;
    max-width: 100% !important;
    max-height: 100% !important;
    object-fit: contain !important;
    margin: auto !important;
}

.playerjs-container iframe,
#clappr-container .clappr-player,
#dplayer-container .dplayer-video-wrap,
#jwplayer-container .jwplayer,
#flowplayer-container .fp-player {
    width: 100% !important;
    height: 100% !important;
}

.video-js video {
    object-fit: contain !important;
}

.message-card {
    background: rgba(0, 0, 0, 0.4) !important;
    color: #fff !important;
    border: none !important;
    font-size: 13px;
    padding: 10px 20px !important;
    border-radius: 20px !important;
    width: auto !important;
    min-height: auto !important;
    box-shadow: none !important;
}

.native-video.hidden,
.playerjs-container.hidden,
.video-js.hidden,
#clappr-container.hidden,
#dplayer-container.hidden,
#openplayer-container.hidden,
#mediachrome-container.hidden,
#shaka-video.hidden,
#dashjs-video.hidden,
#plyr-video.hidden,
#mediaelement-video.hidden,
#jwplayer-container.hidden,
#flowplayer-container.hidden {
    display: none !important;
}

.matches-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    padding: 14px;
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
}

@media (min-width: 769px) {
    .matches-grid {
        grid-template-columns: 1fr 1fr;
    }
}

@media (max-width: 768px) {
    .content-container {
        padding: 84px 12px 100px;
    }

    .site-header {
        padding: 0 10px;
    }

    .sidebar {
        width: 90vw;
        max-width: 90vw;
    }

    .sidebar-section {
        padding: 16px;
    }

    .sidebar-brand {
        padding: 20px 16px;
    }

    .card {
        min-height: 130px;
        padding: 8px;
    }

    .install-btn {
        min-width: 72px;
        font-size: 12px;
        padding: 6px 10px;
    }
}

.match-card {
    text-decoration: none;
    display: block;
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.3s ease;
    aspect-ratio: 1080 / 480;
    width: 100%;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}

.match-card:hover {
    transform: scale(1.04);
}

.match-card img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: fill;
    border-radius: 12px;
}

.empty-section-msg {
    grid-column: 1 / -1;
    text-align: center;
    color: rgba(255, 255, 255, 0.6);
    font-size: 14px;
    padding: 40px 20px;
    font-weight: 700;
}

.player-error-msg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;

.vjs-big-play-centered .vjs-big-play-button {

    border: none;
}

.lightbox { display: flex; justify-content: center; align-items: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); z-index: 999999; }
.lightbox-content { background: #fff; padding: 20px; border-radius: 10px; text-align: center; max-width: 400px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); direction: rtl; margin: 10px; }
.icon-alert { color: #ff5722; margin-bottom: 10px; }

.button-group { display: flex; justify-content: space-between; gap: 10px; }
.btn-download, .btn-hide { padding: 10px 20px; border: none; border-radius: 5px; font-size: 14px; cursor: pointer; text-decoration: none; text-align: center; }

.match_today.container { width: 100%; max-width: 100%; padding: 0; background: transparent; }

#clock { font-size: 0.6em; margin-top: 1px; }

.vjs-control-bar {
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent) !important;
    height: 4em !important;
}

.vjs-button > .vjs-icon-placeholder:before {
    line-height: 2.5 !important;
}

.player-header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10001;
    display: none;
}

.quality-buttons {
    position: absolute;

.quality-menu {

    height: auto;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.quality-menu.show {
    opacity: 1;
    pointer-events: auto;
}

.quality-option-list {
    position: absolute;
    right: 0;
    top: 56px;

.vjs-quality-toggle-button {

    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
}

.vjs-quality-toggle-button:hover {
    background: rgba(255, 255, 255, 0.15);
}

.vjs-quality-toggle-button .vjs-icon-placeholder {
    font-size: 18px;
    line-height: 1;
}

.quality-toggle {
    width: auto;
    height: auto;
    border-radius: 0;
    border: none;
    background: transparent;
    color: #ffffff;
    font-size: 22px;
    padding: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;

.quality-toggle:hover {

.quality-menu.hidden {

}

    border-radius: 50%;

    font-size: 13px;

    cursor: pointer;

    align-items: center;
    justify-content: center;

#player {

}

    #splash-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('https://h.top4top.io/p_3784nirj21.png') center / cover no-repeat fixed; /* مطابقة لخلفية الموقع تماماً */
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000000;
    transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
    font-family: 'Noto Naskh Arabic', serif;
}

#splash-screen.hidden {
    opacity: 0;
    visibility: hidden;
}

.splash-content {
    text-align: center;
    color: #fff;
    width: 90%;
    max-width: 500px;
}

.splash-prayer {
    font-size: 30px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 10px;
    animation: slideDownSplash 0.8s ease-out;
    line-height: 1.5;
}

.splash-welcome {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 25px;
    opacity: 0.9;
    animation: slideDownSplash 1s ease-out;
}

.splash-logo {
    width: 140px;
    height: auto;
    margin-bottom: 30px;
    background: transparent;
    animation: popInSplash 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.4s both;
}

.splash-author-img {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px solid var(--primary);
    padding: 2px;
    background: rgba(255, 255, 255, 0.1);
    margin-bottom: 10px; /* إضافة مسافة تحت الصورة */
    animation: fadeInSplash 1.5s ease-out 1s both;
}

.splash-credits {
    font-family: 'Amiri', serif; /* تطبيق خط الثلث على هذه العبارة فقط */
    font-size: 20px;
    color: rgba(255, 255, 255, 0.9);
    margin-bottom: 0;
    font-style: normal;
    animation: fadeInSplash 1.2s ease-out 0.8s both;
}

.enter-btn {
    padding: 14px 60px;
    font-size: 20px;
    font-weight: 700;
    background: var(--primary);
    color: #fff;
    border: none;

function parseChannelLinks(ch) {

                links.push({ label: entry.label || key, url: entry.url });
            } else if (typeof entry === 'string') {
                links.push({ label: key, url: entry });
            }
        });
    }
    ['mainLink', 'hdLink', 'sdLink', 'backupLink', 'url', 'stream', 'src', 'play', 'link', 'video', 'm3u8', 'mp4'].forEach(prop => {
        if (ch[prop] && typeof ch[prop] === 'string' && !links.some(l => l.url === ch[prop])) {
            links.push({ label: prop, url: ch[prop] });
        }
    });
    if (ch.url && typeof ch.url === 'string' && !links.some(l => l.url === ch.url)) {
        links.push({ label: 'الرئيسي', url: ch.url });
    }
    const priority = ['الرئيسي', 'main', 'auto', 'Auto', 'AUTO'];
    links.sort((a, b) => {
        const aIndex = priority.findIndex(label => a.label.includes(label));
        const bIndex = priority.findIndex(label => b.label.includes(label));
        if (aIndex === -1 && bIndex === -1) return 0;
        if (aIndex === -1) return 1;
        if (bIndex === -1) return -1;
        return aIndex - bIndex;

        toggle.style.display = shouldShowToggle ? 'flex' : 'none';
    }
}

function updateQualityMenu() {
    const list = $('qualityOptionList');
    if (!list) return;
    list.classList.add('hidden');
    if ((currentQualityMode !== 'hls' && currentQualityMode !== 'links') || !currentQualitySources || currentQualitySources.length <= 1) {
        list.innerHTML = '';
        return;
    }
    list.innerHTML = '';
    currentQualitySources.forEach((source, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'quality-option-item' + (idx === currentQualityIndex ? ' active' : '');
        btn.textContent = source.label || `الجودة ${idx + 1}`;
        btn.onclick = (e) => {
            e.stopPropagation();
            currentQualityIndex = idx;
            if (currentQualityMode === 'links') {
                currentLinkIndex = idx;
                setPlayerSource(source.url);
            } else if (currentQualityMode === 'hls') {
                currentQualitySources.forEach((item, i) => {
                    if (item.rep && typeof item.rep.enabled === 'function') {
                        item.rep.enabled(i === idx);
                    }
                });
            }
            document.querySelectorAll('.quality-option-item').forEach((item, i) => item.classList.toggle('active', i === idx));
            closeQualityMenu();
        };
        list.appendChild(btn);
    });
}

function toggleQualityMenu(event) {
    if (event) event.stopPropagation();
    const list = $('qualityOptionList');
    if (list) list.classList.toggle('hidden');
}

function closeQualityMenu() {
    const list = $('qualityOptionList');
    if (list) list.classList.add('hidden');
}

document.addEventListener('click', closeQualityMenu);

function getHlsRepresentations(player) {
    const tech = player.tech({ IWillNotUseThisInPlugins: true });
    if (!tech || !tech.vhs) return [];
    if (typeof tech.vhs.representations === 'function') {
        return tech.vhs.representations().map(rep => ({
            label: rep.height ? `${rep.height}p` : rep.bandwidth ? `${Math.round(rep.bandwidth/1000)}kbps` : 'Unknown',
            rep
        }));
    }
    const master = tech.vhs.playlists && tech.vhs.playlists.master;
    if (!master || !Array.isArray(master.playlists)) return [];
    return master.playlists.map((playlist, index) => ({
        label: playlist.attributes.RESOLUTION ? `${playlist.attributes.RESOLUTION.height}p` : `جودة ${index + 1}`,
        playlist
    }));
}

function detectHlsQualities(player) {
    const reps = getHlsRepresentations(player);
    if (reps.length <= 1) return;
    currentQualityMode = 'hls';
    currentQualitySources = reps;
    currentQualityIndex = 0;
    updateQualityMenu();
    showQualityButtons();
}

function setupQualityButtons(links, mode = 'links') {
    const container = $('qualityButtons');
    if (container) container.innerHTML = '';
    currentQualityMode = mode;
    currentQualitySources = links;
    if (mode === 'links' && links.length > 1) {
        links.forEach((link, idx) => {
            const btn = document.createElement('button');
            btn.className = 'quality-button' + (idx === 0 ? ' active' : '');
            btn.textContent = link.label;
            btn.onclick = (e) => {
                e.stopPropagation();
                currentQualityIndex = idx;
                currentLinkIndex = idx;
                document.querySelectorAll('.quality-button').forEach((b, i) => b.classList.toggle('active', i === idx));
                setPlayerSource(link.url);
                updateQualityMenu();
            };
            if (container) container.appendChild(btn);
        });
    }
    updateQualityMenu();
    showQualityButtons();
}

function cleanupNativePlayer() {
    const nativeEl = $('native-video');
    if (nativePlayerInstance && typeof nativePlayerInstance.destroy === 'function') nativePlayerInstance.destroy();
    nativePlayerInstance = null;
    if (nativeEl) {
        nativeEl.pause();
        nativeEl.src = '';
        nativeEl.classList.add('hidden');
    }
}

function cleanupPlayerJS() {
    const playerjsEl = $('playerjs-container');
    if (playerjsEngineInstance && typeof playerjsEngineInstance.destroy === 'function') playerjsEngineInstance.destroy();
    playerjsEngineInstance = null;
    if (playerjsEl) {
        playerjsEl.innerHTML = '';
        playerjsEl.classList.add('hidden');
    }
}

function initializePlayerJS(url) {
    const playerjsEl = $('playerjs-container');
    if (!playerjsEl) {
        setPlayerSource(url, 'native', false);
        return;
    }
    if (typeof window.Playerjs === 'undefined') {
        if (!attemptedFallbacks.native) {
            attemptedFallbacks.native = true;
            setPlayerSource(url, 'native', false);
            return;
        }
        if (!attemptedFallbacks.videojs) {
            attemptedFallbacks.videojs = true;
            setPlayerSource(url, 'videojs', false);
            return;
        }
        fallbackToNextLink();
        return;
    }
    cleanupPlayerJS();
    showActivePlayer('playerjs');
    playerjsEngineInstance = new Playerjs({ id: 'playerjs-container', file: url, autoplay: true });
    if (playerjsEngineInstance && typeof playerjsEngineInstance.on === 'function') {
        playerjsEngineInstance.on('error', () => {
            if (!attemptedFallbacks.native) {
                attemptedFallbacks.native = true;
                setPlayerSource(url, 'native', false);
                return;
            }
            if (!attemptedFallbacks.videojs) {
                attemptedFallbacks.videojs = true;
                setPlayerSource(url, 'videojs', false);
                return;
            }
            fallbackToNextLink();
        });
    }
}

function showActivePlayer(engine) {
    cleanupAllPlayers();
    let id = '';
    switch(engine) {
        case 'videojs': case 'hlsjs': case 'flvjs': id = 'video-player'; break;
        case 'shaka': id = 'shaka-video'; break;
        case 'dashjs': id = 'dashjs-video'; break;
        case 'clappr': id = 'clappr-container'; break;
        case 'plyr': id = 'plyr-video'; break;
        case 'dplayer': id = 'dplayer-container'; break;
        case 'mediaelement': id = 'mediaelement-video'; break;
        case 'openplayer': id = 'openplayer-container'; break;
        case 'mediachrome': id = 'mediachrome-container'; break;
        case 'playerjs': id = 'playerjs-container'; break;
        case 'youtube': id = 'youtube-container'; break;
        case 'native': id = 'native-video'; break;
    }
    if (id && $(id)) $(id).classList.remove('hidden');
}

function initializeNativePlayer(url) {
    const nativeEl = $('native-video');
    if (!nativeEl) return;
    cleanupNativePlayer();
    showActivePlayer('native');
    nativeEl.controls = true;
    nativeEl.autoplay = true;
    nativeEl.playsInline = true;
    nativeEl.removeAttribute('src');
    nativeEl.load();
    if (url.includes('m3u8') && window.Hls && Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(nativeEl);
        nativePlayerInstance = hls;
    } else {
        nativeEl.src = url;
        nativePlayerInstance = nativeEl;
    }
    nativeEl.onloadedmetadata = () => nativeEl.play().catch(() => {});
    if (url.includes('m3u8') && window.Hls && Hls.isSupported()) {
        const hls = nativePlayerInstance;
        hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
                hls.destroy();
                fallbackToNextEngine(url);
            }
        });
    }
    nativeEl.onerror = () => {
        fallbackToNextEngine(url);
    };
}

function setPlayerSource(url, engine = 'videojs', resetFallbacks = true) {
    if (!url) return;
    
    if (!resetFallbacks && parallelEngineSuccessful) return;
    
    currentPlayerEngine = engine;
    if (resetFallbacks) {
        Object.keys(attemptedFallbacks).forEach(k => attemptedFallbacks[k] = false);
        parallelEngineSuccessful = false;
    }
    attemptedFallbacks[engine] = true;
    showActivePlayer(engine);

    const engineSelect = $('playerEngineSelect');
    if (engineSelect) {
        if (resetFallbacks) {
            engineSelect.value = 'auto';
        } else {
            engineSelect.value = engine;
        }
    }

    try {
        switch(engine) {
            case 'videojs':
                videojsInstance = videojs('video-player', { autoplay: true, controls: true, responsive: true, fluid: false, preload: 'auto', muted: false });
                videojsInstance.src({ src: url, type: url.includes('m3u8') ? 'application/x-mpegURL' : 'video/mp4' });
                videojsInstance.ready(function() {
                    if (!resetFallbacks) parallelEngineSuccessful = true;
                    this.play().catch(e => console.error("Autoplay failed:", e));
                });
                videojsInstance.on('error', () => fallbackToNextEngine(url));
                break;
            case 'hlsjs':
                if (Hls.isSupported()) {
                    hlsjsInstance = new Hls();
                    hlsjsInstance.loadSource(url);
                    const v = $('video-player');
                    hlsjsInstance.attachMedia(v);
                    hlsjsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        v.play().catch(e => console.error("HLS Autoplay failed:", e));
                    });
                    hlsjsInstance.on(Hls.Events.ERROR, (e, data) => { if (data.fatal) fallbackToNextEngine(url); });
                } else fallbackToNextEngine(url);
                break;
            case 'shaka':
                const sv = $('shaka-video');
                shakaPlayerInstance = new shaka.Player(sv);
                shakaPlayerInstance.load(url).then(() => {
                    sv.play().catch(e => console.error("Shaka Autoplay failed:", e));
                }).catch(() => fallbackToNextEngine(url));
                shakaPlayerInstance.addEventListener('error', () => fallbackToNextEngine(url));
                break;
            case 'dashjs':
                const dv = $('dashjs-video');
                dashjsInstance = dashjs.MediaPlayer().create();
                dashjsInstance.initialize(dv, url, true);
                dv.play().catch(e => console.error("DASH Autoplay failed:", e));
                dashjsInstance.on('error', () => fallbackToNextEngine(url));
                break;
            case 'clappr':
                clapprInstance = new Clappr.Player({ source: url, parentId: '#clappr-container', autoPlay: true, mute: false });
                clapprInstance.on(Clappr.Events.PLAYER_READY, () => {
                    const cv = document.querySelector('#clappr-container video');
                    if (cv) cv.play().catch(e => console.error("Clappr Autoplay failed:", e));
                });
                clapprInstance.on(Clappr.Events.PLAYER_ERROR, () => fallbackToNextEngine(url));
                break;
            case 'plyr':
                const pv = $('plyr-video');
                plyrInstance = new Plyr(pv, { autoplay: true });
                pv.src = url;
                pv.play().catch(e => console.error("Plyr Autoplay failed:", e));
                pv.onerror = () => fallbackToNextEngine(url);
                break;
            case 'dplayer':
                dplayerInstance = new DPlayer({ container: $('dplayer-container'), video: { url: url, type: url.includes('m3u8') ? 'hls' : 'auto' }, autoplay: true });
                dplayerInstance.play();
                dplayerInstance.on('error', () => fallbackToNextEngine(url));
                break;
            case 'mediaelement':
                mediaelementInstance = new MediaElementPlayer('mediaelement-video', { 
                    success: (me) => { 
                        me.setSrc(url); 
                        me.play().catch(e => console.error("MediaElement Autoplay failed:", e));
                        me.addEventListener('error', () => fallbackToNextEngine(url));
                    },
                    error: () => fallbackToNextEngine(url)
                });
                break;
            case 'openplayer':
                openplayerInstance = new OpenPlayerJS('openplayer-container');
                openplayerInstance.init();
                openplayerInstance.src = { src: url, type: 'application/x-mpegURL' };
                const ov = document.querySelector('#openplayer-container video');
                if (ov) {
                    ov.play().catch(e => console.error("OpenPlayer Autoplay failed:", e));
                    ov.onerror = () => fallbackToNextEngine(url);
                }
                break;
            case 'mediachrome':
                const mv = $('mediachrome-video');
                mv.src = url;
                mv.play().catch(e => console.error("MediaChrome Autoplay failed:", e));
                mv.onerror = () => fallbackToNextEngine(url);
                break;
            case 'flvjs':
                if (flvjs.isSupported()) {
                    const fv = $('video-player');
                    flvjsInstance = flvjs.createPlayer({ type: 'flv', url: url });
                    flvjsInstance.attachMediaElement(fv);
                    flvjsInstance.load();
                    flvjsInstance.play().catch(e => console.error("FLV Autoplay failed:", e));
                    flvjsInstance.on(flvjs.Events.ERROR, () => fallbackToNextEngine(url));
                } else fallbackToNextEngine(url);
                break;
            case 'jwplayer':
                if (typeof jwplayer !== 'undefined') {
                    jwplayerInstance = jwplayer('jwplayer-container').setup({
                        file: url,
                        autostart: true,
                        mute: false,
                        width: '100%',
                        height: '100%'
                    });
                    jwplayerInstance.on('error', () => fallbackToNextEngine(url));
                    jwplayerInstance.on('setupError', () => fallbackToNextEngine(url));
                } else fallbackToNextEngine(url);
                break;
            case 'flowplayer':
                if (typeof flowplayer !== 'undefined') {
                    flowplayerInstance = flowplayer('#flowplayer-container', {
                        clip: { sources: [{ type: 'application/x-mpegurl', src: url }] },
                        autoplay: true
                    });
                    flowplayerInstance.on('error', () => fallbackToNextEngine(url));
                } else fallbackToNextEngine(url);
                break;
            case 'youtube':
                try {
                    showActivePlayer('youtube');
                    const iframe = $('youtube-iframe');
                    if (iframe) {
                        // convert common youtube links to embed URL
                        const id = (function extractYouTubeID(u){
                            try {
                                const urlObj = new URL(u);
                                if (urlObj.hostname.includes('youtu.be')) return urlObj.pathname.slice(1);
                                if (urlObj.hostname.includes('youtube.com')) return urlObj.searchParams.get('v');
                            } catch(e) {}
                            // fallback: try regex
                            const m = u.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
                            return m ? m[1] : null;
                        })(url);
                        if (id) {
                            iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&playsinline=1`;
                        } else {
                            // direct embed or playlist
                            iframe.src = url;
                        }
                    }
                } catch(e) { fallbackToNextEngine(url); }
                break;
            case 'playerjs':
                initializePlayerJS(url);
                break;
            case 'native':
                initializeNativePlayer(url);
                break;
        }
    } catch(e) {
        console.error(`Error in engine ${engine}:`, e);
        fallbackToNextEngine(url);
    }
}

function showPlayerError(msg) {
    const el = $('player-error-msg');
    if (el) {
        el.textContent = msg;
        el.classList.remove('hidden');
        setTimeout(() => el.classList.add('hidden'), 3500);

}

function hidePlayer() {
    cleanupAllPlayers();
    $('playerContainer').classList.add('hidden');
    const errorMsg = $('player-error-msg');
    if (errorMsg) errorMsg.classList.add('hidden');
    document.body.classList.remove('player-open');
    document.body.style.overflow = '';

    const videoElements = document.querySelectorAll('video');
    videoElements.forEach(video => {
        try {
            video.pause();
            video.muted = true;
            video.volume = 0;
            video.currentTime = 0;
        } catch (e) {}
    });

    const iframes = document.querySelectorAll('iframe');
    iframes.forEach(iframe => {
        try {
            if (iframe.src && (iframe.src.includes('youtube.com') || iframe.src.includes('youtu.be'))) {
                iframe.src = '';
            }
        } catch (e) {}
    });

    if (document.fullscreenElement) {
        document.exitFullscreen().catch(err => console.log("Exit fullscreen failed:", err));
    }
    if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
    }

    currentChannelId = null;
    currentPlayerEngine = null;
    currentChannelLinks = [];
    currentQualitySources = [];
    
    // عند إغلاق المشغل يدوياً (بالضغط على X)، نحدث الرابط ليعود للقسم
    pushState();
}

async function selectChannel(channel, pushHistory = true) {
    const links = parseChannelLinks(channel);
    if (!links.length) {
        if ($('grid')) $('grid').innerHTML = '<div class="card message-card">لا يوجد رابط بث صالح لهذه القناة</div>';
        return;
    }
    currentChannelId = channel.id;
    currentChannelLinks = links;
    currentLinkIndex = 0;
    currentQualityIndex = 0;
    currentQualityMode = 'links';
    setupQualityButtons(links, 'links');
    
    // عند فتح القناة، نحافظ على وجود المستخدم في القسم الحالي
    showPlayer(pushHistory);
    
    // Smart play: prefer YouTube, then m3u8, then mp4, else fallback to trying engines in parallel
    playSmart(links);
}

function playSmart(links) {
    if (!links || !links.length) return;
    // find YouTube link
    const yt = links.find(l => /(?:youtube\.com|youtu\.be)/i.test(l.url || ''));
    if (yt) {
        currentLinkIndex = links.indexOf(yt);
        currentQualityMode = 'links';
        currentQualityIndex = currentLinkIndex;
        setPlayerSource(yt.url, 'youtube', false);
        setupQualityButtons(links, 'links');
        return;
    }
    // find m3u8
    const hls = links.find(l => l.url && l.url.includes('.m3u8'));
    if (hls) {
        currentLinkIndex = links.indexOf(hls);
        currentQualityMode = 'links';
        currentQualityIndex = currentLinkIndex;
        const preferred = getPreferredPlayerEngine(hls.url) || 'videojs';
        setPlayerSource(hls.url, preferred, false);
        setupQualityButtons(links, 'links');
        return;
    }
    // find mp4
    const mp4 = links.find(l => l.url && l.url.match(/\.mp4($|\?)/i));
    if (mp4) {
        currentLinkIndex = links.indexOf(mp4);
        currentQualityMode = 'links';
        currentQualityIndex = currentLinkIndex;
        setPlayerSource(mp4.url, 'videojs', false);
        setupQualityButtons(links, 'links');
        return;
    }
    // fallback: try multiple engines in parallel on the first link
    tryEnginesInParallel(links[0].url, 5);
}

async function renderCurrentView() {
    const grid = $('grid');
    if (!grid) return;
    
    // 1. تحديد المعرف الحالي بدقة
    let currentId = (currentStack && currentStack.length > 0) ? String(currentStack[currentStack.length - 1]) : null;
    
    // تنظيف المعرف من القيم الوهمية
    if (!currentId || currentId === "" || currentId === "null" || currentId === "undefined" || currentId === "0") {
        currentId = null;
    }

    // تصفير الشبكة قبل العرض
    grid.innerHTML = ''; 

    // التأكد من وجود بيانات
    const allCategories = Object.values(categoriesCache || {});
    if (allCategories.length === 0) {
        grid.innerHTML = '<div class="empty-section-msg">جاري تحميل البيانات من قاعدة البيانات...</div>';
        return;
    }

    // --- الصفحة الرئيسية ---
    if (currentId === null) {
        // فلترة الأقسام الرئيسية (التي ليس لها أب أو أبوه غير موجود في القائمة)
        let roots = allCategories.filter(c => {
            const pid = normalizeParentId(c.parentId);
            return !pid || pid === "" || !categoriesCache[pid];
        });

        // إذا لم نجد جذوراً محددة، نعرض جميع الأقسام المتاحة لضمان عدم بقاء الصفحة فارغة
        const toDisplay = roots.length > 0 ? roots : allCategories;

        toDisplay.forEach(cat => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="${cat.img || DEFAULT_IMAGE}" onerror="this.src='${DEFAULT_IMAGE}'"><div class="card-title">${cat.name}</div>`;
            card.onclick = () => {
                if (cat.link) {
                    window.currentViewMode = 'externalLink';
                    window.currentExternalUrl = cat.link;
                    applyViewMode();
                    pushState();
                    return;
                }
                currentStack.push(String(cat.id));
                pushState();
                renderCurrentView();
            };
            grid.appendChild(card);
        });
        return;
    }

    // --- داخل قسم معين ---
    // 1. الأقسام الفرعية التابعة لهذا القسم
    const subs = allCategories.filter(c => normalizeParentId(c.parentId) === String(currentId));
    subs.forEach(sub => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<img src="${sub.img || DEFAULT_IMAGE}" onerror="this.src='${DEFAULT_IMAGE}'"><div class="card-title">${sub.name}</div>`;
        card.onclick = () => {
            currentStack.push(String(sub.id));
            pushState();
            renderCurrentView();
        };
        grid.appendChild(card);
    });

    // 2. القنوات التابعة لهذا القسم
    const channels = (channelsCache || []).filter(ch => {
        const cids = getChannelCategoryIds(ch);
        return cids.includes(String(currentId));
    });

    channels.forEach(ch => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<img src="${ch.img || DEFAULT_IMAGE}" onerror="this.src='${DEFAULT_IMAGE}'"><div class="card-title">${ch.name}</div>`;
        card.onclick = () => selectChannel(ch);
        grid.appendChild(card);
    });

    if (subs.length === 0 && channels.length === 0) {
        grid.innerHTML = '<div class="empty-section-msg">عذراً، هذا القسم لا يحتوي على محتوى حالياً</div>';
    }
}

function performSearch(query) {
    const grid = $('grid');
    if (!grid) return;
    const q = String(query || '').trim().toLowerCase();
    if (!q) { renderCurrentView(); return; }
    grid.innerHTML = '';
    const categories = Object.values(categoriesCache || {}).filter(c => (c.name || '').toLowerCase().includes(q));
    const channels = (channelsCache || []).filter(ch => (ch.name || '').toLowerCase().includes(q) || (ch.tags || '').toString().toLowerCase().includes(q));

    if (!categories.length && !channels.length) {
        grid.innerHTML = '<div class="empty-section-msg">لم يتم العثور على نتائج</div>';
        return;
    }

    if (categories.length) {
        const header = document.createElement('div');
        header.className = 'empty-section-msg';
        header.textContent = 'الأقسام المطابقة';
        grid.appendChild(header);
        categories.forEach(cat => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="${cat.img || DEFAULT_IMAGE}" onerror="this.src='${DEFAULT_IMAGE}'"><div class="card-title">${cat.name}</div>`;
            card.onclick = () => { currentStack.push(cat.id); pushState(); renderCurrentView(); };
            grid.appendChild(card);
        });
    }

    if (channels.length) {
        const header = document.createElement('div');
        header.className = 'empty-section-msg';
        header.textContent = 'القنوات المطابقة';
        grid.appendChild(header);
        channels.forEach(ch => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="${ch.img || DEFAULT_IMAGE}" onerror="this.src='${DEFAULT_IMAGE}'"><div class="card-title">${ch.name}</div>`;
            card.onclick = () => selectChannel(ch);
            grid.appendChild(card);
        });
    }
}

let playerControlsTimer = null;
function showPlayerControls() {
    const qButtons = $('qualityButtons');
    const qMenu = $('qualityMenu');
    if (qButtons) qButtons.classList.add('show');
    if (qMenu) qMenu.classList.add('show');

    playerControlsTimer = setTimeout(() => {
        if (qButtons) qButtons.classList.remove('show');
        if (qMenu) qMenu.classList.remove('show');
    }, 3000);
}

function initVideoPlayer() {
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && $('playerContainer') && !$('playerContainer').classList.contains('hidden')) window.history.back();
    });

    const playerContainer = $('playerContainer');
    if (playerContainer) {
        ['mousemove', 'touchstart', 'click'].forEach(evt => {
            playerContainer.addEventListener(evt, showPlayerControls);
        });
    }

    const engineSelect = $('playerEngineSelect');
    if (engineSelect) {
        engineSelect.addEventListener('change', () => {
            if (currentChannelLinks && currentChannelLinks.length > 0) {
                const engine = engineSelect.value;
                if (engine !== 'auto') {
                    currentLinkIndex = 0;
                    currentQualityIndex = 0;
                    attemptedFallbacks[engine] = false; 
                    setTimeout(() => {
                        setPlayerSource(currentChannelLinks[0].url, engine, false);
                        setupQualityButtons(currentChannelLinks, 'links');
                    }, 150);
                } else {
                    currentLinkIndex = 0;
                    currentQualityIndex = 0;
                    Object.keys(attemptedFallbacks).forEach(k => attemptedFallbacks[k] = false);
                    setTimeout(() => {
                        setPlayerSource(currentChannelLinks[0].url, getPreferredPlayerEngine(currentChannelLinks[0].url), false);
                        setupQualityButtons(currentChannelLinks, 'links');
                    }, 150);
                }
            }
        });
    }
}

function normalizeParentId(value) {
    if (value === null || value === undefined) return '';
    const str = String(value).trim();
    if (!str) return '';
    const cleaned = str.toLowerCase();
    if (['null', 'undefined', 'false', '0'].includes(cleaned)) return '';
    return str;
}

async function refreshCategoriesCache() {
    try {
        const catSnap = await database.ref('categories').once('value');
        const map = {};
        catSnap.forEach(c => {
            map[c.key] = {
                id: c.key,
                ...c.val(),
                parentId: normalizeParentId(c.val().parentId)
            };
        });
        categoriesCache = map;
    } catch (error) { categoriesCache = {}; }
}

async function refreshChannelsCache() {
    try {
        const chanSnap = await database.ref('channels').once('value');
        const list = [];
        chanSnap.forEach(ch => { list.push({ id: ch.key, ...ch.val() }); });
        channelsCache = list;
    } catch (error) { channelsCache = []; }
}

function enterSite() {
    const splash = document.getElementById('splash-screen');
    if (splash) {
        splash.classList.add('hidden');
        document.body.style.overflow = ''; // استعادة التمرير
    }
}

async function init() {
    if (appInitialized) return;
    appInitialized = true;
    
    // منع التمرير أثناء ظهور واجهة الدخول
    document.body.style.overflow = 'hidden';
    
    // إخفاء واجهة الدخول تلقائياً بعد 5 ثوانٍ
    setTimeout(enterSite, 5000);
    
    initVideoPlayer();
    
    // تهيئة الحالة الأولية لمنع الخروج المفاجئ
    if (!window.history.state) {
        window.history.replaceState({ path: 'navigation', stack: [], channelId: null, viewMode: 'home', externalUrl: '' }, '', window.location.href);
    }

    currentStack = [];
    
    // 1. تحميل البيانات الأولية مرة واحدة والانتظار
    await Promise.all([refreshCategoriesCache(), refreshChannelsCache()]);
    
    // 2. استعادة الحالة من الرابط (Hash)
    const hashState = restoreHashState();
    currentStack = hashState.stack || [];
    currentChannelId = hashState.channelId || null;
    window.currentViewMode = hashState.viewMode || 'home';
    window.currentExternalUrl = hashState.externalUrl || '';

    if (currentChannelId && !channelsCache.some(ch => ch.id === currentChannelId)) {
        currentChannelId = null;
    }

    // 3. تطبيق العرض الأولي
    applyViewMode();
    await renderCurrentView();

    // 4. تشغيل القناة إذا كانت موجودة في الرابط
    if (currentChannelId) {
        const channel = channelsCache.find(ch => ch.id === currentChannelId);
        if (channel) await selectChannel(channel, false);
    }

    // 5. تفعيل التحديثات التلقائية (Real-time Sync)
    database.ref('categories').on('value', (snapshot) => {
        const map = {};
        snapshot.forEach(c => {
            map[c.key] = {
                id: c.key,
                ...c.val(),
                parentId: normalizeParentId(c.val().parentId)
            };
        });
        categoriesCache = map;
        renderCurrentView(); // تحديث الواجهة فوراً عند تغير البيانات
    });

    database.ref('channels').on('value', (snapshot) => {
        const list = [];
        snapshot.forEach(ch => { list.push({ id: ch.key, ...ch.val() }); });
        channelsCache = list;
        renderCurrentView(); // تحديث الواجهة فوراً عند تغير البيانات
    });
}

function openSidebar() { document.body.classList.add('sidebar-open'); }
function closeSidebar() { document.body.classList.remove('sidebar-open'); }

function hideLightbox() {
    const lightbox = $('lightbox-alert');
    if (lightbox) {
        lightbox.style.display = 'none';
        localStorage.setItem('lightboxHidden', 'true');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('lightboxHidden') === 'true') {
        const lightbox = $('lightbox-alert');
        if (lightbox) lightbox.style.display = 'none';
    }

    const qualityToggle = $('qualityToggle');
    if (qualityToggle) qualityToggle.addEventListener('click', toggleQualityMenu);
    const sidebarToggle = $('sidebarToggle');
    if (sidebarToggle) sidebarToggle.addEventListener('click', (event) => {
        event.stopPropagation();
        if (document.body.classList.contains('sidebar-open')) closeSidebar(); else openSidebar();
    });
    const searchToggle = $('searchToggle');
    const headerSearch = $('headerSearch');
    if (searchToggle && headerSearch) {
        searchToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            headerSearch.classList.toggle('visible');
            if (headerSearch.classList.contains('visible')) { headerSearch.focus(); headerSearch.select(); }
            else { headerSearch.value = ''; renderCurrentView(); }
        });
        headerSearch.addEventListener('input', (e) => performSearch(e.target.value));
        headerSearch.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { headerSearch.classList.remove('visible'); headerSearch.value = ''; renderCurrentView(); }
            if (e.key === 'Enter') { performSearch(headerSearch.value); }
        });
        document.addEventListener('click', (ev) => { if (!headerSearch.contains(ev.target) && ev.target !== searchToggle) { headerSearch.classList.remove('visible'); } });
    }
    const sidebarOverlay = $('sidebarOverlay');
    if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);
    const installBtn = $('installBtn');
    window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        if (installBtn) installBtn.classList.remove('hidden');
    });
    if (installBtn) {
        installBtn.addEventListener('click', async () => {
            if (!deferredInstallPrompt) return;
            deferredInstallPrompt.prompt();
            const choiceResult = await deferredInstallPrompt.userChoice;
            deferredInstallPrompt = null;
            installBtn.classList.add('hidden');
        });
    }
    if ('serviceWorker' in navigator) {
        const swCode = `
            const CACHE_NAME = 'alfaham-tv-cache-v1';
            const ASSETS = ['/', 'index.html', 'admin.html'];
            self.addEventListener('install', event => {
                event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(ASSETS)));
                self.skipWaiting();
            });
            self.addEventListener('activate', event => {
                event.waitUntil(caches.keys().then(keys => Promise.all(
                    keys.filter(key => key !== CACHE_NAME).map(key => caches.delete(key))
                )));
                self.clients.claim();
            });
            self.addEventListener('fetch', event => {
                if (event.request.method !== 'GET') return;
                event.respondWith(
                    caches.match(event.request).then(cachedResponse => {
                        if (cachedResponse) return cachedResponse;
                        return fetch(event.request).then(networkResponse => {
                            if (!networkResponse || networkResponse.status !== 200 || networkResponse.type !== 'basic') return networkResponse;
                            const responseClone = networkResponse.clone();
                            caches.open(CACHE_NAME).then(cache => cache.put(event.request, responseClone));
                            return networkResponse;
                        }).catch(() => caches.match('index.html'));
                    })
                );
            });
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(err => console.warn('SW registration failed:', err));
    }
    const homeNav = $('homeNav');
    const matchesNav = $('matchesNav');
    if (homeNav && matchesNav) {
        const goToHome = () => {
            window.currentViewMode = 'home'; window.currentExternalUrl = '';
            homeNav.classList.add('active'); matchesNav.classList.remove('active');
            if ($('grid')) $('grid').classList.remove('hidden');
            if ($('matchesTableContainer')) $('matchesTableContainer').classList.add('hidden');
            if ($('externalLinkContainer')) $('externalLinkContainer').classList.add('hidden');
            currentStack = []; currentChannelId = null; pushState(); renderCurrentView();
            if ($('playerContainer') && !$('playerContainer').classList.contains('hidden')) hidePlayer();
        };
        homeNav.addEventListener('click', goToHome);
        matchesNav.addEventListener('click', () => {
            window.currentViewMode = 'externalLink';
            window.currentExternalUrl = 'https://www.yala-sport-now.com';
            applyViewMode();
            pushState();
        });
    }
});

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

function closeExternalLink() {
    window.currentViewMode = 'home';
    window.currentExternalUrl = '';
    if ($('externalLinkContainer')) $('externalLinkContainer').classList.add('hidden');
    if ($('grid')) $('grid').classList.remove('hidden');
    const homeNav = $('homeNav');
    const matchesNav = $('matchesNav');
    if (homeNav) homeNav.classList.add('active');
    if (matchesNav) matchesNav.classList.remove('active');
    if ($('externalLinkIframe')) $('externalLinkIframe').src = '';
    pushState();
}

function openMatchLink(url) {
    if (!url) return;
    window.currentExternalUrl = url;
    window.currentViewMode = 'externalLink';
    applyViewMode();
    pushState();
}
